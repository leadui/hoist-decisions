<!DOCTYPE html>
<!-- Hoist live demo, rebuilt on the Bento MADR kit (bentomadr/).
     Every decision moment is a bento canvas — tap a card to pick;
     a created MADR record opens as a canvas by default (raw
     markdown behind a toggle). Data layer unchanged:
     live Muse Spark drafts in, MADR records out, via hoist.py. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoist — decision moments</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="bento-kit.css">
<style>
  :root{
    --ink:var(--bk-ink); --ink-2:var(--bk-muted); --line:var(--bk-line);
    --accent:var(--bk-accent); --accent-soft:var(--bk-well); --warn:var(--bk-bad);
    --code-bg:var(--bk-frame); --code-ink:var(--bk-tile);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bk-paper);color:var(--bk-ink);font-family:var(--bk-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .page{max-width:1060px;margin:0 auto;padding:28px 20px 64px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .topbar h1{font-family:var(--bk-display);font-size:26px;letter-spacing:-0.01em;margin:0;font-weight:780}
  .topbar h1 i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--bk-accent);margin-right:9px}
  .topnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .topnav a,.theme-btn{font:inherit;font-size:13px;font-weight:600;color:var(--bk-muted);text-decoration:none;border:1px solid var(--bk-line);border-radius:999px;padding:8px 16px;white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;background:var(--bk-tile);cursor:pointer}
  .topnav a.on{color:var(--bk-accent);border-color:var(--bk-accent)}
  .theme-btn:hover{border-color:var(--bk-accent);color:var(--bk-accent)}
  .theme-btn:focus-visible{outline:2px dashed var(--bk-muted);outline-offset:3px}
  :focus-visible{outline:2px solid var(--bk-accent);outline-offset:2px}
  .lede{color:var(--bk-muted);margin:4px 0 14px;max-width:62ch}
  .offlinebar{display:none;background:var(--bk-choice);border:1px solid var(--bk-signal);border-radius:10px;padding:8px 14px;font-size:13.5px;margin-bottom:12px;color:var(--bk-ink)}
  .offlinebar.on{display:block}
  .err{color:var(--bk-bad);font-size:13.5px}
  .sample-badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--bk-on-signal);background:var(--bk-signal);border-radius:999px;padding:3px 12px;margin-left:10px;vertical-align:2px;text-decoration:none}
  .card{background:var(--bk-tile);border:1px solid var(--bk-line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
  .card h2{font-family:var(--bk-display);font-size:19px;margin:0 0 6px;font-weight:700}
  .hint{font-size:13.5px;color:var(--bk-muted);margin:2px 0 10px}
  .btn{font:inherit;font-weight:650;font-size:14px;cursor:pointer;border-radius:10px;padding:11px 22px;background:var(--bk-accent);border:1px solid var(--bk-accent);color:#fff}
  [data-theme="dark"] .btn{color:#0c1712}
  .btn:disabled{background:var(--bk-well);border-color:var(--bk-line);color:var(--bk-muted);opacity:1;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--bk-ink);border-color:var(--bk-line)}
  .mini-btn{font:inherit;font-size:13.5px;font-weight:650;cursor:pointer;white-space:nowrap;border-radius:8px;padding:8px 16px;background:var(--bk-accent);border:1px solid var(--bk-accent);color:#fff}
  [data-theme="dark"] .mini-btn{color:#0c1712}
  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
  .actions .spacer{flex:1}
  .qtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .qtab{position:relative;font:inherit;font-size:13px;font-weight:650;cursor:pointer;background:var(--bk-tile);color:var(--bk-muted);border:1px solid var(--bk-line);border-radius:999px;padding:6px 14px;min-height:36px}
  .qtab + .qtab::before{content:"";position:absolute;left:-9px;top:50%;width:8px;height:2px;background:var(--bk-line)}
  .commitbar{position:sticky;bottom:12px;z-index:5;background:var(--bk-tile);border:1px solid var(--bk-line);border-radius:12px;padding:10px 12px;box-shadow:0 10px 28px rgba(20,30,25,.16)}
  .qtab[aria-pressed="true"]{color:var(--bk-accent);border-color:var(--bk-accent);background:var(--bk-well)}
  .qtab[data-empty="1"]{opacity:.55}
  .qtab.done{color:var(--bk-good);border-color:var(--bk-good)}
  .qcount{font-size:12.5px;color:var(--bk-muted);font-weight:600}
  .fork{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  @media (max-width:520px){.fork{grid-template-columns:1fr}}
  .fork button{font:inherit;text-align:left;cursor:pointer;border:1px solid var(--bk-line);border-radius:12px;background:var(--bk-tile);color:var(--bk-ink);padding:14px 16px}
  .fork button strong{display:block;font-size:15px;font-family:var(--bk-display)}
  .fork button span{font-size:13px;color:var(--bk-muted)}
  .fork button.primary{background:var(--bk-accent);border-color:var(--bk-accent);color:#fff}
  [data-theme="dark"] .fork button.primary{color:#0c1712}
  .fork button.primary span{color:inherit;opacity:.85}
  .opts{display:grid;gap:10px;margin-top:12px}
  .optrow{display:flex;gap:10px;align-items:stretch}
  .opt{flex:1;font:inherit;text-align:left;cursor:pointer;background:var(--bk-tile);color:var(--bk-ink);border:1px solid var(--bk-line);border-radius:12px;padding:12px 14px;min-width:0}
  .opt .onum{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;border:1px solid var(--bk-line);color:var(--bk-muted);font-size:12px;font-weight:700;margin-right:8px;vertical-align:1px}
  .opt b{font-size:14.5px;font-family:var(--bk-display)}
  .opt small{display:block;font-size:13px;color:var(--bk-muted);margin-top:1px}
  .opt[aria-pressed="true"]{border:2px solid var(--bk-signal);padding:11px 13px}
  .opt[aria-pressed="true"] .onum{border-color:var(--bk-signal);color:var(--bk-ink)}
  .escape-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--bk-line);font-size:13px;color:var(--bk-muted)}
  .captured{display:flex;gap:12px;align-items:center;margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bk-good);background:color-mix(in srgb, var(--bk-good) 10%, var(--bk-tile));animation:capIn .35s ease-out}
  .captured b{display:block;font-size:15px}
  .captured span:not(.cap-check){display:block;font-size:13px;color:var(--bk-muted)}
  .cap-check{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bk-good);color:#fff;font-weight:800;animation:capPop .45s cubic-bezier(.2,1.4,.4,1)}
  .cap-check.sm{width:20px;height:20px;font-size:12px;margin-right:4px;vertical-align:-4px}
  .commitbar.is-captured{border-color:var(--bk-good)}
  #bk-moment .bk-stamp.is-captured{background:var(--bk-good);color:#fff}
  #bk-moment.is-captured .bk-opt.is-chosen{border-color:var(--bk-good)}
  .moment-enter{animation:momentIn .32s ease-out}
  @keyframes capIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes capPop{from{transform:scale(.4)}to{transform:scale(1)}}
  @keyframes momentIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.captured,.cap-check,.moment-enter{animation:none}}
  .canvas-bar{margin:0 0 10px;display:grid;gap:6px}
  .cb-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .list-opt.rec-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .rec-row .cb-map{width:52px}
  .rec-row small.fill{display:block;margin-top:2px}
  .cb-map{display:grid;gap:3px;width:64px;flex:none;padding:4px;border:2.5px solid var(--bk-ink);border-radius:10px;grid-auto-rows:7px;background:var(--bk-ink)}
  .cb-map span{border-radius:2px;background:var(--bk-tile, #fff)}
  .cb-map span.ok{background:var(--bk-tile, #fff)}
  .cb-map span.miss{background:var(--bk-signal)}
  .cb-title{display:block;font-size:15px}
  .cb-count{display:block;font-size:12.5px;color:var(--bk-muted)}
  .cb-kinds{display:flex;flex-wrap:wrap;gap:6px}
  .cb-kind{font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent;color:var(--bk-muted);border:1px solid var(--bk-line);border-radius:999px;padding:4px 11px;min-height:32px}
  .cb-kind[aria-pressed="true"]{background:var(--bk-ink);color:var(--bk-bg, #fff);border-color:var(--bk-ink)}
  .cb-why{margin:0;font-size:12.5px;line-height:1.5;color:var(--bk-muted);max-width:90ch}
  .critic-row .escape-btn[aria-pressed="true"]{border-color:var(--bk-signal);box-shadow:inset 0 0 0 1px var(--bk-signal)}
  .escape-btn{font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--bk-ink);border:1px solid var(--bk-line);border-radius:999px;padding:5px 13px;min-height:36px}
  .escape-btn:hover{border-color:var(--bk-accent);color:var(--bk-accent)}
  .custom-row{display:flex;gap:8px;margin-top:10px}
  .custom-row input{flex:1;font:inherit;font-size:14px;color:var(--bk-ink);background:var(--bk-tile);border:1px solid var(--bk-line);border-radius:8px;padding:8px 12px}
  .task-input{width:100%;font:inherit;font-size:14px;color:var(--bk-ink);background:var(--bk-tile);border:1px solid var(--bk-line);border-radius:10px;padding:10px 12px;min-height:62px;max-height:240px;resize:vertical}
  .progress{background:var(--bk-well);border:1px solid var(--bk-line);border-left:3px solid var(--bk-accent);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--bk-muted);position:relative;overflow:hidden}
  .progress::after{content:"";position:absolute;left:0;top:0;bottom:0;width:33%;background:linear-gradient(100deg,transparent,var(--bk-choice),transparent);animation:sweep 1.6s ease-in-out infinite}
  @keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(310%)}}
  .skel{display:grid;gap:10px;margin:12px 0}
  .skel-bar{height:14px;border-radius:7px;background:var(--bk-well);border:1px solid var(--bk-line);position:relative;overflow:hidden}
  .skel-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,var(--bk-choice) 50%,transparent 80%);animation:sweep 1.6s ease-in-out infinite}
  .veil{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
  .sheet{background:var(--bk-paper);color:var(--bk-ink);border-radius:16px;max-width:900px;width:100%;padding:18px;margin:auto 0}
  .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .sheet-top h2{font-family:var(--bk-display);font-size:21px;margin:0}
  .sheet-top .sub{font-size:13.5px;color:var(--bk-muted);margin:2px 0 0}
  .x-btn{flex:none;font:inherit;font-size:13px;font-weight:650;cursor:pointer;border:1px solid var(--bk-line);border-radius:999px;padding:6px 14px;background:var(--bk-tile);color:var(--bk-ink);white-space:nowrap;min-height:36px}
  .x-btn:hover{border-color:var(--bk-accent);color:var(--bk-accent)}
  #bk-moment .bk-opts.rich{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  #bk-moment .bk-opt.is-chosen{border:2px solid var(--bk-signal);padding:13px}
  #bk-moment .bk-nums{display:grid;gap:0;margin:0}
  #bk-moment .bk-nums div{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--bk-line);padding:3px 0;font-size:12.5px}
  #bk-moment .bk-nums dt{color:var(--bk-muted)}
  #bk-moment .bk-nums dd{margin:0;font-weight:600;text-align:right}
  #bk-moment .bk-steps{display:flex;flex-wrap:wrap;gap:5px}
  #bk-moment .bk-steps span{font-size:11.5px;font-weight:600;border:1px solid var(--bk-line);border-radius:999px;padding:2px 9px;color:var(--bk-muted)}
  .typing{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--bk-muted);animation:tblink 1.2s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes tblink{0%,100%{opacity:.25}50%{opacity:1}}
  .rec-fields{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;padding:0}
  .rec-fields div{font-size:12px;font-weight:600;color:var(--bk-muted);background:var(--bk-tile);border:1px solid var(--bk-line);border-radius:999px;padding:2px 11px}
  .rec-fields div b{color:var(--bk-ink);font-weight:700}
  pre.record{background:var(--code-bg);color:var(--code-ink);font-family:var(--bk-mono);font-size:12.5px;line-height:1.6;border-radius:10px;padding:14px 16px;overflow-x:auto;white-space:pre-wrap;margin:0 0 12px}
  details.raw{margin-top:12px}
  details.raw summary{font-size:13px;font-weight:600;color:var(--bk-muted);cursor:pointer}
  details.raw pre.record{margin-top:8px}
  .conflict-block{font-family:var(--bk-mono);font-size:13px;line-height:1.6;color:var(--bk-bad);background:var(--bk-tile);border:1px solid var(--bk-bad);border-radius:10px;padding:10px 14px;margin-top:10px;white-space:pre-wrap}
  .rev-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bk-line)}
  .rev-row:last-of-type{border-bottom:none}
  .rev-row b{display:block;font-size:14px}
  .rev-a{display:block;font-size:13px;color:var(--bk-muted)}
  .note{background:var(--bk-well);border:1px solid var(--bk-line);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:13.5px;color:var(--bk-muted)}
  .note strong{color:var(--bk-ink)}
  .list-opt{display:block;text-decoration:none;color:var(--bk-ink)}
  @media (max-width: 560px) {
    .page { padding: 20px 14px 48px; }
    .actions .btn { flex: 1; }
    .sheet { padding: 14px; }
    .opts .opt { min-width: 0; }
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <h1><i></i>Hoist</h1>
    <div class="topnav">
      <a id="nav-home" href="#/">Start</a>
      <a id="nav-session" href="#/session">Session</a>
      <a id="nav-records" href="#/records">Records</a>
      <button class="theme-btn" id="theme-toggle" type="button">Theme: Light</button>
    </div>
  </div>
  <div class="offlinebar" id="offline"><strong>Lost contact with Hoist</strong> — showing the last saved state. Restart Hoist, then reload to pick up where you left off.</div>
  <div id="app" aria-live="polite"></div>
</div>
<script src="bento-kit.js"></script>
<script>
(function () {
  "use strict";

  var ICONS = {
    expand: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4"/><path d="M13.5 2.5L9 7"/><path d="M6.5 13.5h-4v-4"/><path d="M2.5 13.5L7 9"/></svg>'
  };
  var TYPING = ' <span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function lc(s) { s = String(s == null ? "" : s); return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
  function slugify(t) {
    var s = String(t == null ? "" : t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    return s.length <= 60 ? s : s.slice(0, 61).replace(/-[^-]*$/, "");
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function doorWord(n) { return n === 3 ? "one-way" : n === 2 ? "heavy" : n === 1 ? "two-way" : "one-way"; }
  function stripTags(s) { return String(s == null ? "" : s).replace(/<[^>]*>/g, ""); }

  var S = null, LIVE = false, CAT = null, CATFAIL = false, PACKS = [], CTX = { kind: "session" }, SIM = null;

  var state = { qid: null, phase: "moment", path: null, picked: null,
    answers: {}, skipped: {}, abandoned: {}, added: {}, showCustom: false,
    records: {}, err: null, theme: "light", kindView: {}, critic: {}, criticBusy: null, saving: false, enter: false };

  function resetState() {
    state.qid = null; state.phase = "moment"; state.path = null; state.picked = null;
    state.answers = {}; state.skipped = {}; state.abandoned = {};
    state.added = {}; state.showCustom = false; state.records = {}; state.err = null;
    state.kindView = {}; state.critic = {}; state.criticBusy = null; state.saving = false; state.enter = false;
  }

  function Q() {
    for (var i = 0; i < PACKS.length; i++) if (PACKS[i].id === state.qid) return PACKS[i];
    return PACKS[0] || null;
  }
  function momentNum() {
    for (var i = 0; i < PACKS.length; i++) if (PACKS[i].id === state.qid) return (i + 1) + " of " + PACKS.length;
    return "";
  }
  function allOptions() {
    var q = Q();
    return q.options.concat(state.added[q.id] || []);
  }
  function optBy(v) {
    var opts = allOptions();
    for (var i = 0; i < opts.length; i++) if (opts[i].value === v) return opts[i];
    return null;
  }

  /* ── Bento templates registered on the kit ── */
  if (typeof BentoKit === "undefined") {
    /* Kit assets missing: keep working with controls instead of blanking. */
    window.__BK_MISSING = true;
  } else {
  BentoKit.templates["madr-record"] = { id: "madr-record", name: "MADR record", cols: "1.2fr 1fr 1fr",
    areas: ["problem verdict verdict", "problem gains costs", "confirm people people", "shelf shelf shelf", "more more more"],
    md: { cols: "1fr 1fr", areas: ["problem problem", "verdict verdict", "gains costs", "confirm people", "shelf shelf", "more more"] },
    slots: [["problem", "problem"], ["verdict", "decision"], ["gains", "gains"], ["costs", "costs"], ["confirm", "confirm"], ["people", "people"], ["shelf", "proscons"], ["more", "more"]] };
  }

  function metricsOf(q, opts) {
    var out = [];
    if (q.growth) {
      var nowVals = {}, laterVals = {};
      opts.forEach(function (o) { nowVals[o.value] = o.mNow; laterVals[o.value] = o.mLater; });
      out.push({ name: q.growth.title + " · " + q.growth.now, better: "low", values: nowVals });
      out.push({ name: q.growth.title + " · " + q.growth.later, better: "low", values: laterVals });
    } else if (q.microLabel) {
      var vals = {};
      opts.forEach(function (o) { if (o.micro != null) vals[o.value] = o.micro; });
      if (Object.keys(vals).length) out.push({ name: q.microLabel, better: "low", values: vals });
    }
    return out;
  }
  function momentData(q, pickedId) {
    var opts = allOptions();
    var drivers = driversOf(q);
    var context = [];
    if (q.model) context.push(q.model);
    var dr = q.draft;
    var whyNow = dr && dr.why_now ? dr.why_now : (q.plan && q.plan.why) || "";
    var undo = (dr && dr.undo) || (q.plan && q.plan.why) || "";
    if (whyNow) context.push(whyNow);
    if (undo && undo !== whyNow) context.push("Cost to undo: " + undo);
    var picked = pickedId ? optBy(pickedId) : null;
    var labels = [];
    opts.forEach(function (o) { (o.numbers || []).forEach(function (n) { if (labels.indexOf(n[0]) < 0) labels.push(n[0]); }); });
    var attributes = labels.map(function (L) {
      var v = {};
      opts.forEach(function (o) { (o.numbers || []).forEach(function (n) { if (n[0] === L) v[o.value] = n[1]; }); });
      return { name: L, values: v };
    }).filter(function (a) { return Object.keys(a.values).length > 1; });
    var prosCons = {};
    opts.forEach(function (o) {
      var items = [];
      (o.unlocks || []).forEach(function (t) { items.push({ kind: "good", text: t }); });
      (o.watch || []).forEach(function (t) { items.push({ kind: "bad", text: t }); });
      prosCons[o.value] = items;
    });
    return {
      title: q.title, question: q.title, context: context,
      options: opts.map(function (o) { return { id: o.value, name: o.name, desc: o.desc }; }),
      prosCons: prosCons,
      chosen: pickedId || null,

  /* ── Draft fields → kit compartments ── */
  var KIND_IDS = ["tech-choice", "vendor-select", "build-vs-buy", "product-bet", "migration", "process-change"];
  function kindOf(q) {

  function assumptionsOf(q, pickedId, used) {

  function parseRecord(md) {

    for (; i < lines.length; i++) {
      var ln = lines[i];
      var h1 = /^#\s+(.*)$/.exec(ln);
      var h2 = /^##\s+(.*)$/.exec(ln);
      var q = /^>\s?(.*)$/.exec(ln);
      if (h1 && !title) { title = h1[1]; continue; }
      if (h2) { if (cur) secs.push(cur); cur = { h: h2[1], blocks: [] }; continue; }
      if (q) { quote += (quote ? " " : "") + q[1]; continue; }
      if (!cur) continue;
      var h3 = /^###\s+(.*)$/.exec(ln);
      var li = /^-\s+(.*)$/.exec(ln);
      var ol = /^\d+\.\s+(.*)$/.exec(ln);
      if (h3) cur.blocks.push({ sub: h3[1] });
      else if (li) cur.blocks.push({ li: li[1] });
      else if (ol) cur.blocks.push({ ol: ol[1] });
      else if (!/^\s*$/.test(ln)) cur.blocks.push({ p: ln });

    }
    if (ses && ses.plan) {
      var asks = ses.plan.decisions.filter(function (d) { return d.mode === "ask"; });
      var left = asks.filter(function (d) { return !(ses.outcomes || {})[d.id]; }).length;
      html += '<a class="opt list-opt" href="#/session"><b>' + esc(ses.task || "Task session") + "</b><small>" +
        esc(ses.status === "ready" ? left + " of " + asks.length + " left to decide" : "Muse Spark is preparing it…") + "</small></a>";
    } else if (ses) {
      html += '<a class="opt list-opt" href="#/session"><b>' + esc(ses.task || "Task session") + "</b><small>Muse Spark is preparing it…</small></a>";
    }
    html += '<a class="opt list-opt" href="#/session" style="border:2px solid var(--bk-signal)"><b>' + (LIVE ? "Walk a task" : "Walk the sample task") + "</b><small>" +
      esc(LIVE ? "Describe a task; Muse Spark finds every hard-to-undo choice in it." : "Add user accounts with saved projects · three moments drafted by Muse Spark") + "</small></a>";
    html += "</div>";
    return html;
  }
  function recordsHtml() {
    var recs = (S.records || []).slice().reverse();
    var badge = LIVE ? "" : '<a class="sample-badge" href="landing.html#install">Sample data</a>';
    var html = '<p class="lede">Every saved decision, newest first.</p><div class="card"><h2>Decision records' + badge + "</h2>";
    if (!recs.length) html += '<p class="hint">No records yet. Finish a walk-through and they land here.</p>';
    for (var i = 0; i < recs.length; i++) {
      var title = "Record";
      var m = /^#\s+(.+)$/m.exec(recs[i].markdown || "");
      if (m) title = m[1];
      var sub = recs[i].file;
      var dm = /^date:\s*(\S+)/m.exec(recs[i].markdown || "");
      if (dm) sub = dm[1] + " · " + sub;
      var om = />\s*\*\*Decision:\*\*\s*([^.*]+)/.exec(recs[i].markdown || "");
      if (om) sub += " — " + om[1].trim().slice(0, 80);
      var mp = null;
      if (typeof BentoKit !== "undefined" && BentoKit.templates["madr-record"]) {
        try { mp = bentoMap(BentoKit.templates["madr-record"], recordData(recs[i])); } catch (e) { mp = null; }
      }
      html += '<a class="opt list-opt rec-row" href="#/records/' + esc(recs[i].file) + '"><span><b>' + esc(title) + "</b><small>" + esc(sub) + "</small>" +
        (mp ? '<small class="fill">' + mp.filled + " of " + mp.total + " compartments" + (mp.missing.length ? " · missing " + esc(mp.missing.join(", ").toLowerCase()) : " · complete") + "</small>" : "") +
        "</span>" + (mp ? mp.html : "") + "</a>";
    }
    return html + "</div>";
  }
  function recordOneHtml(param) {
    var rec = null;
    (S.records || []).forEach(function (r) {
      if (r.file === param || (r.file || "").indexOf(param) === 0) rec = r;
    });
    if (!rec) return '<div class="card"><h2>No record by that name.</h2><a class="opt list-opt" href="#/records"><b>All records</b></a></div>';
    return '<p class="lede">Saved as <strong>' + esc(rec.file) + ".</strong></p>" +
      recordViewHtml(rec, "bk-one") +
      '<a class="opt list-opt" href="#/records" style="margin-top:12px"><b>All records</b></a>';
  }

  function mountInto(id, templateOrId, data, o) {
    var el = $(id);
    if (!el || typeof BentoKit === "undefined") return;
    try { BentoKit.render(el, templateOrId, data, o); } catch (e) { el.innerHTML = '<p class="err">This canvas could not be drawn.</p>'; }
  }
  function mountCanvases() {
    var q = Q();
    var m = $("bk-moment");
    if (m && q && (state.phase === "hoist" || state.phase === "moment")) {
      if (window.__BK_MISSING) m.innerHTML = fallbackOptsHtml(q);
      else {
        var data = momentData(q, state.picked);
        var comp = composeMoment(q, data);
        var capd = isCaptured(q);
        mountInto("bk-moment", comp.template, data, { questions: { lead: capd ? "Your options — decided" : state.picked ? "Your options — tap to change the pick" : "Your options — tap one to pick it" } });
        if (capd) m.querySelectorAll(".bk-opt.is-chosen .bk-stamp, .bk-oh.is-chosen .bk-stamp").forEach(function (st) { st.textContent = "✓ Captured"; st.classList.add("is-captured"); });
      }
      optionCardsWire(q);
    }
    document.querySelectorAll("[id^='bk-rec-']").forEach(function (el) {
      var qid = el.id.slice(7);
      var rec = state.records[qid];
      if (rec && rec.markdown) mountInto(el.id, "madr-record", recordData({ file: (rec.record || "").split("/").pop(), markdown: rec.markdown }));
    });
    var one = $("bk-one");
    if (one) {
      var h = (typeof location !== "undefined" && location.hash) || "";
      var param = decodeURIComponent(h.slice(10));
      var rec2 = null;
      (S.records || []).forEach(function (r) { if (r.file === param || (r.file || "").indexOf(param) === 0) rec2 = r; });
      if (rec2) mountInto("bk-one", "madr-record", recordData(rec2));
    }
  }

  function render() {
    var h = (typeof location !== "undefined" && location.hash) || "#/";
    var nav = function (id, on) { var el = $(id); if (el) { if (on) el.classList.add("on"); else el.classList.remove("on"); } };
    var app = $("app");
    if (!app) return;
    if (h.indexOf("#/decide/") === 0) {
      nav("nav-home", true); nav("nav-session", false); nav("nav-records", false);
      var id = h.slice(9);
      var dec = null;
      (S.decisions || []).forEach(function (x) { if (x.id === id) dec = x; });
      if (!dec) { app.innerHTML = '<div class="card"><h2>No decision by that name.</h2><a class="opt list-opt" href="#/"><b>Open now</b></a></div>'; paintModal(); return; }
      if (dec.status !== "open") {
        var rec = null;
        (S.records || []).forEach(function (r) { if (dec.record && (dec.record || "").indexOf(r.file) !== -1) rec = r; });
        app.innerHTML = '<p class="lede">This one is <strong>decided.</strong></p>' +
          (rec ? recordViewHtml(rec, "bk-one") : '<p class="hint">Saved as ' + esc(dec.record || "") + ".</p>") +
          conflictHtml(dec) +
          '<a class="opt list-opt" href="#/" style="margin-top:12px"><b>Open now</b></a>';
        mountCanvases();
        return;
      }
      if (!CAT) { app.innerHTML = CATFAIL ? '<div class="card"><h2>This interruption needs the local app.</h2><p class="hint">The decision catalog ships with the Hoist install — run <code>python3 hoist.py serve</code> and open this page from there. Meanwhile the <a href="#/session">sample task session</a> works anywhere.</p></div>' : progressHtml({ task: "Loading the decision…", status: "planning", total: 1, drafted: [] }); return; }
      if (CTX.kind !== "decide" || CTX.id !== id || !PACKS.length) { CTX = { kind: "decide", id: id }; buildDecidePack(dec); resetState(); state.qid = PACKS[0].id; ensurePick(Q()); }
      app.innerHTML = engineHtml();
      mountCanvases();
      return;
    }
    if (h.indexOf("#/records/") === 0) {
      nav("nav-home", false); nav("nav-session", false); nav("nav-records", true);
      app.innerHTML = recordOneHtml(decodeURIComponent(h.slice(10)));
      mountCanvases();
      return;
    }
    if (h === "#/records") {
      nav("nav-home", false); nav("nav-session", false); nav("nav-records", true);
      app.innerHTML = recordsHtml();
      return;
    }
    if (h === "#/session") {
      nav("nav-home", false); nav("nav-session", true); nav("nav-records", false);
      if (CTX.kind !== "session") { CTX = { kind: "session" }; resetState(); buildSessionPacks(); restoreFromOutcomes(); }
      app.innerHTML = sessionHtml();
      mountCanvases();
      return;
    }
    nav("nav-home", true); nav("nav-session", false); nav("nav-records", false);
    app.innerHTML = homeHtml();
  }

  function onClick(ev) {
    var t = ev.target && ev.target.closest ? ev.target.closest("[data-action]") : null;
    if (!t) return;
    var action = t.getAttribute("data-action");
    var v = t.getAttribute("data-v");
    if (action === "q") switchQ(v);
    else if (action === "pick") pick(v);
    else if (action === "escape") doEscape(v);
    else if (action === "delegate") delegate();
    else if (action === "propose") propose();
    else if (action === "drop") dropChallenger();
    else if (action === "review") { state.phase = "review"; state.err = null; render(); }
    else if (action === "change") changeQ(v);
    else if (action === "file") fileRecords();
    else if (action === "confirm") confirm("chosen");
    else if (action === "next") advance();
    else if (action === "kind") { var kq = Q(); if (kq) { state.kindView[kq.id] = v; render(); } }
    else if (action === "critic") askCritic(v);
    else if (action === "restart") {
      if (CTX.kind === "decide") { location.hash = "#/"; return; }
      S.session = null; SIM = null;
      CTX = { kind: "session" }; resetState();
      render();
    }
    else if (action === "conflict") showConflict(v);
    else if (action === "ex") { var el = $("taskIn"); if (el) el.value = v; }
    else if (action === "start") { var ti = $("taskIn"); startSession(ti ? ti.value : "", false); }
    else if (action === "retry") startSession((S.session || {}).task || "", true);
  }

  function loadTheme() {
    var saved = null;
    try { saved = window.localStorage ? window.localStorage.getItem("hoist-theme") : null; } catch (e) { saved = null; }
    if (saved === "light" || saved === "dark") return saved;
    if (typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
    return "light";
  }
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", state.theme);
    var btn = $("theme-toggle");
    if (btn) btn.textContent = "Theme: " + (state.theme === "dark" ? "Dark" : "Light");
    try { if (window.localStorage) window.localStorage.setItem("hoist-theme", state.theme); } catch (e) { /* private mode */ }
  }
  function toggleTheme() {
    state.theme = state.theme === "dark" ? "light" : "dark";
    applyTheme();
  }

  function needCAT() {
    return ((typeof location !== "undefined" && location.hash) || "").indexOf("#/decide/") === 0 && !CAT;
  }

  function loadingHtml() {
    return '<div class="card"><h2>Opening Hoist</h2><p class="hint">Loading your decision moments.</p>' +
      '<div class="skel" aria-hidden="true">' +
      '<div class="skel-bar" style="width:42%"></div>' +
      '<div class="skel-bar" style="width:88%"></div>' +
      '<div class="skel-bar" style="width:71%"></div>' +
      '<div class="skel-bar" style="width:95%"></div></div></div>';
  }
  function boot() {
    state.theme = loadTheme();
    applyTheme();
    var app = $("app");
    if (app) app.innerHTML = loadingHtml();
    loadState().then(function () {
      if (!S) {
        $("app").innerHTML = '<p class="err">Couldn\'t load the decisions. Browsers block data files when this page is opened directly — serve it with <code>cd site && python3 -m http.server 8000</code> and open <code>http://localhost:8000/#/session</code>, or run <code>python3 hoist.py serve</code> for the live session.</p>';
        return;
      }
      render();
      if (needCAT()) ensureCAT().then(render, render);
      document.addEventListener("click", onClick);
      window.addEventListener("hashchange", function () {
        if (needCAT()) ensureCAT().then(render, render);
        else render();
      });
      var tb = $("theme-toggle");
      if (tb && tb.addEventListener) tb.addEventListener("click", toggleTheme);
      setInterval(function () {
        var ses = S.session;
        var busy = !!SIM || (ses && (ses.status === "planning" || ses.status === "drafting"));
        if (!busy || !LIVE) return;
        var before = JSON.stringify([ses && ses.status, ses && ses.drafted, (S.decisions || []).map(function (d) { return d.id + d.status; })]);
        loadState().then(function () {
          var after = JSON.stringify([S.session && S.session.status, S.session && S.session.drafted,
            (S.decisions || []).map(function (d) { return d.id + d.status; })]);
          if (after !== before) render();
        });
      }, 1500);
    });
  }

  window.__hoist = { state: state, boot: boot, render: render, packs: function () { return PACKS; },
    switchQ: switchQ, pick: pick,
    confirm: confirm, propose: propose, startSession: startSession, ctx: function () { return CTX; } };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
