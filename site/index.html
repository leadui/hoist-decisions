<!DOCTYPE html>
<!-- Hoist, rebuilt on the decision-moments engine (Muse POC).
     Flow, components, and tokens follow examples/decision-moment.html:
     decision moment -> expanding options -> hyper dive -> saved record.
     Voice stripped per owner; packs come from live Muse Spark drafts. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoist — decision moments</title>
<style>
  :root, [data-theme="light"] {
    --bg: #ffffff;
    --surface: #f4f2ec;
    --ink: #14181d;
    --ink-2: #3d4450;
    --line: #d9dce1;
    --accent: #0b5fff;
    --accent-ink: #ffffff;
    --accent-soft: #e8effd;
    --code-bg: #10151b;
    --code-ink: #e8edf2;
  }
  [data-theme="dark"] {
    --bg: #0e1113;
    --surface: #171c1f;
    --ink: #f0f3f5;
    --ink-2: #b9c2cb;
    --line: #2c343b;
    --accent: #5b93ff;
    --accent-ink: #0b1220;
    --accent-soft: #16233d;
    --code-bg: #05080b;
    --code-ink: #dbe4ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  .page { max-width: 700px; margin: 0 auto; padding: 28px 20px 64px; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .topbar h1 { font-size: 24px; letter-spacing: -0.01em; margin: 0; font-weight: 700; }
  .topnav { display: flex; gap: 8px; align-items: center; }
  .topnav a {
    font-size: 13px; font-weight: 600; color: var(--ink-2); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; white-space: nowrap;
  }
  .topnav a.on { color: var(--accent); border-color: var(--accent); }
  .theme-btn {
    font: inherit; font-size: 13px; font-weight: 600;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; cursor: pointer; white-space: nowrap;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lede { color: var(--ink-2); margin: 4px 0 14px; max-width: 56ch; }
  .offlinebar {
    display: none; background: var(--accent-soft);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-size: 13.5px; margin-bottom: 12px;
  }
  .offlinebar.on { display: block; }
  .err { color: #b3261e; font-size: 13.5px; }
  [data-theme="dark"] .err { color: #ff8a80; }

  .qtabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .qtab {
    font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
    background: transparent; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
  }
  .qtab[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .qtab.done { color: #137333; border-color: #9ed0a8; background: #e6f4ea; }
  [data-theme="dark"] .qtab.done { color: #7dd79b; border-color: #2f5c3e; background: #12241a; }

  .msg { display: flex; gap: 10px; margin-bottom: 12px; }
  .who {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line);
    font-size: 12px; font-weight: 700; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
  }
  .msg.agent .who { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
  .bubble {
    border: 1px solid var(--line); border-radius: 4px 12px 12px 12px;
    padding: 10px 14px; font-size: 14.5px; max-width: 100%;
  }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--surface); border-radius: 12px 4px 12px 12px; }
  .msg.user .who { order: 2; }

  .interrupt {
    border: 2px solid var(--accent); border-radius: 12px;
    padding: 14px 16px; margin: 6px 0 12px 40px;
  }
  .interrupt h2 { font-size: 16px; margin: 0 0 4px; }
  .interrupt p { font-size: 14px; color: var(--ink-2); margin: 0 0 12px; }
  .interrupt .moment-q { font-size: 16.5px; font-weight: 650; color: var(--ink); margin: 0 0 8px; }
  .path-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 520px) { .path-row { grid-template-columns: 1fr; } }
  .path-btn {
    font: inherit; text-align: left; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--ink); padding: 10px 14px;
  }
  .path-btn:hover { border-color: var(--accent); }
  .path-btn strong { display: block; font-size: 14.5px; }
  .path-btn span { font-size: 13px; color: var(--ink-2); }
  .path-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .path-btn.primary span { color: var(--accent-ink); opacity: 0.85; }

  .edu { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 12px 40px; }
  .edu-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .edu h2 { font-size: 17px; margin: 0; }
  .q-hint { font-size: 13.5px; color: var(--ink-2); margin: 2px 0 12px; }

  .model {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; margin-bottom: 12px;
    font-size: 13.5px;
  }
  .model strong { display: block; font-size: 12.5px; margin-bottom: 2px; }

  .opt {
    display: block; width: 100%; text-align: left; cursor: pointer; font: inherit;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  a.opt { text-decoration: none; }
  .opt:hover { border-color: var(--ink-2); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt b { font-size: 14.5px; }
  .opt small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
  .opt .why { display: block; font-size: 13.5px; margin-top: 6px; }
  .micro { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .micro small { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; margin: 0; }
  .micro-track { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
  .micro-fill { height: 100%; border-radius: 4px; background: var(--ink-2); }
  .opt[aria-pressed="true"] .micro-fill { background: var(--accent); }
  .journey { display: flex; align-items: stretch; gap: 0; margin-top: 8px; flex-wrap: wrap; }
  .jstep {
    flex: 1 1 0; min-width: 100px;
    font-size: 12px; line-height: 1.4; text-align: center;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; background: var(--bg); position: relative;
  }
  .jstep:not(:last-child) { margin-right: 18px; }
  .jstep:not(:last-child)::after {
    content: "→"; position: absolute; right: -16px; top: 50%;
    transform: translateY(-50%); color: var(--ink-2); font-size: 13px;
  }
  .nums { margin: 8px 0 0; }
  .num-row {
    display: grid; grid-template-columns: 120px 1fr; gap: 10px;
    padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px;
  }
  .num-row dt { margin: 0; color: var(--ink-2); }
  .num-row dd { margin: 0; font-weight: 550; }
  .chip-row { margin-top: 8px; }
  .chip-label { font-size: 12px; color: var(--ink-2); margin: 6px 0 4px; display: flex; align-items: center; gap: 5px; }
  .chip {
    display: inline-block; font-size: 12.5px; font-weight: 550;
    border-radius: 999px; padding: 2px 10px; margin: 0 6px 6px 0;
    border: 1px solid var(--line); background: var(--surface);
  }
  .chip.go { background: var(--bg); border-color: var(--accent); }

  .chart { margin: 12px 0 4px; }
  .chart-title { font-size: 13px; font-weight: 700; }
  .chart-note { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
  svg.growth text { font-family: ui-sans-serif, system-ui, sans-serif; }
  .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
  .btn {
    font: inherit; font-weight: 650; font-size: 14px; cursor: pointer;
    border-radius: 8px; padding: 10px 20px;
    background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink);
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .quick-pick { display: grid; gap: 8px; margin-top: 10px; }
  .qcount { font-size: 12.5px; color: var(--ink-2); font-weight: 600; align-self: center; }
  .escape-row {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--ink-2);
  }
  .escape-btn {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px;
  }
  .escape-btn:hover { border-color: var(--accent); color: var(--accent); }
  .custom-row { display: flex; gap: 8px; margin-top: 10px; }
  .custom-row input {
    flex: 1; font: inherit; font-size: 14px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px;
  }
  .task-input {
    width: 100%; font: inherit; font-size: 14px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; min-height: 62px; resize: vertical;
  }
  .mini-btn {
    font: inherit; font-size: 13.5px; font-weight: 650; cursor: pointer; white-space: nowrap;
    border-radius: 8px; padding: 8px 16px;
    background: var(--accent); border: 1px solid var(--accent); color: var(--accent-ink);
  }
  .custom-pick {
    margin-top: 10px; font-size: 13.5px;
    border: 1px solid var(--accent); background: var(--accent-soft);
    border-radius: 8px; padding: 8px 12px;
  }
  .custom-pick button {
    font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
    background: none; border: none; padding: 0; color: var(--accent); margin-left: 8px;
  }
  .rev-row {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .rev-row:last-of-type { border-bottom: none; }
  .rev-row b { display: block; font-size: 14px; }
  .rev-a { display: block; font-size: 13px; color: var(--ink-2); }
  .record-q { margin-bottom: 14px; }
  .record-q > strong { display: block; font-size: 13.5px; margin-bottom: 6px; }
  .deferred-note {
    background: var(--surface); border: 1px dashed var(--line);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--ink-2);
  }
  .yours {
    display: inline-block; font-size: 11.5px; font-weight: 700;
    color: var(--accent); border: 1px solid var(--accent);
    border-radius: 999px; padding: 0 9px; margin-left: 8px; vertical-align: 2px;
  }
  .researching {
    margin-top: 10px; font-size: 13.5px; color: var(--ink-2);
    border: 1px dashed var(--accent); border-radius: 8px; padding: 10px 14px;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  .optrow { display: flex; gap: 8px; align-items: stretch; margin-bottom: 8px; }
  .optrow .opt { flex: 1; margin-bottom: 0; min-width: 0; }
  .hyper-btn {
    flex: none; width: 46px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
  }
  .hyper-btn:hover { border-color: var(--accent); color: var(--accent); }
  .opt .chev { float: right; margin-top: 4px; transition: transform 160ms ease; }
  .onum {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--ink-2);
    font-size: 12px; font-weight: 700; margin-right: 8px; vertical-align: 1px;
  }
  .opt[aria-pressed="true"] .onum { border-color: var(--accent); color: var(--accent); }
  .opt[aria-pressed="true"] .chev { transform: rotate(180deg); }
  .expand-hint { font-size: 12.5px; color: var(--ink-2); margin: -4px 0 10px; }
  .veil {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(10, 14, 20, 0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 24px 16px; overflow-y: auto;
  }
  .sheet {
    background: var(--bg); color: var(--ink);
    border-radius: 14px; max-width: 640px; width: 100%;
    padding: 20px 20px 24px; margin: auto 0;
  }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .sheet h2 { font-size: 20px; margin: 0; }
  .sheet .sub { font-size: 13.5px; color: var(--ink-2); margin: 2px 0 0; }
  .x-btn {
    flex: none; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px;
    background: transparent; color: var(--ink); white-space: nowrap;
  }
  .x-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sheet-sec { font-size: 12.5px; font-weight: 700; margin: 16px 0 6px; color: var(--ink-2); }
  .typing { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); animation: tblink 1.2s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes tblink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .sheet-story { margin: 0; font-size: 14.5px; }
  .learn-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .learn-list a { color: var(--accent); font-size: 14px; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  .record-wrap { margin: 0 0 12px 40px; }
  .record-banner {
    background: var(--accent-soft); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
  }
  .record-banner h2 { margin: 0 0 4px; font-size: 16px; }
  .record-banner p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
  pre.record {
    background: var(--code-bg); color: var(--code-ink);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.6; border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; white-space: pre-wrap; margin: 0 0 12px;
  }
  .restart {
    font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px;
  }
  .restart:hover { border-color: var(--ink-2); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <h1>Hoist</h1>
    <div class="topnav">
      <a id="nav-home" href="#/">Open</a>
      <a id="nav-session" href="#/session">Session</a>
      <a id="nav-records" href="#/records">Records</a>
      <button class="theme-btn" id="theme-toggle" type="button">Theme: Light</button>
    </div>
  </div>
  <div class="offlinebar" id="offline">Hoist isn't answering — showing the last thing it said. Start it again and reload.</div>
  <div id="app" aria-live="polite"></div>
  <div id="modal"></div>
</div>

<script>
(function () {
  "use strict";

  var ICONS = {
    check: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5l3.5 3.5 7-8"/></svg>',
    warn: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8L15 13.5H1z"/><path d="M8 6v3.4"/><circle cx="8" cy="11.4" r="0.4" fill="currentColor"/></svg>',
    expand: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4"/><path d="M13.5 2.5L9 7"/><path d="M6.5 13.5h-4v-4"/><path d="M2.5 13.5L7 9"/></svg>',
    chev: '<svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>'
  };

  var TYPING = ' <span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>';

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function lc(s) { s = String(s == null ? "" : s); return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
  function slugify(t) {
    var s = String(t == null ? "" : t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    return s.length <= 60 ? s : s.slice(0, 61).replace(/-[^-]*$/, "");
  }
  function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function doorWord(n) { return n === 3 ? "one-way" : n === 2 ? "heavy" : n === 1 ? "two-way" : "one-way"; }

  var S = null, LIVE = false, CAT = null, PACKS = [], CTX = { kind: "session" }, SIM = null;

  var state = { qid: null, phase: "moment", path: null, picked: null,
    answers: {}, skipped: {}, abandoned: {}, added: {}, showCustom: false,
    hyper: null, records: {}, err: null, theme: "light",
    deepLoading: {}, deepErr: {}, deepTried: {} };

  function resetState() {
    state.qid = null; state.phase = "moment"; state.path = null; state.picked = null;
    state.answers = {}; state.skipped = {}; state.abandoned = {};
    state.added = {}; state.showCustom = false; state.hyper = null; state.records = {}; state.err = null;
    state.deepLoading = {}; state.deepErr = {}; state.deepTried = {};
  }

  function Q() {
    for (var i = 0; i < PACKS.length; i++) if (PACKS[i].id === state.qid) return PACKS[i];
    return PACKS[0] || null;
  }
  function momentNum() {
    for (var i = 0; i < PACKS.length; i++) if (PACKS[i].id === state.qid) return (i + 1) + " of " + PACKS.length;
    return "";
  }
  function allOptions() {
    var q = Q();
    return q.options.concat(state.added[q.id] || []);
  }
  function optBy(v) {
    var opts = allOptions();
    for (var i = 0; i < opts.length; i++) if (opts[i].value === v) return opts[i];
    return null;
  }

  function msgHtml(who, text) {
    return '<div class="msg ' + who + '"><span class="who">' + (who === "agent" ? "H" : "You") + "</span>" +
      '<div class="bubble">' + text + "</div></div>";
  }

  function journeyHtml(o) {
    if (!o.journey || !o.journey.length) return "";
    var html = '<div class="journey" aria-label="What happens step by step">';
    for (var i = 0; i < o.journey.length; i++) {
      html += '<div class="jstep">' + esc(o.journey[i]) + "</div>";
    }
    return html + "</div>";
  }

  function chipsHtml(items, cls) {
    var html = "";
    for (var i = 0; i < items.length; i++) html += '<span class="chip ' + cls + '">' + esc(items[i]) + "</span>";
    return html;
  }

  function deepHtml(o) {
    var nums = o.numbers || [], un = o.unlocks || [], wa = o.watch || [];
    if (!nums.length && !un.length && !wa.length) return "";
    var html = "";
    if (nums.length) {
      html += '<dl class="nums">';
      for (var i = 0; i < nums.length; i++) {
        html += '<div class="num-row"><dt>' + esc(nums[i][0]) + "</dt><dd>" + esc(nums[i][1]) + "</dd></div>";
      }
      html += "</dl>";
    }
    if (un.length || wa.length) {
      html += '<div class="chip-row">';
      if (un.length) html += '<div class="chip-label">' + ICONS.check + "Unlocks</div>" + chipsHtml(un, "go");
      if (wa.length) html += '<div class="chip-label">' + ICONS.warn + "Watch out for</div>" + chipsHtml(wa, "");
      html += "</div>";
    }
    return html;
  }

  function chartName(n) {
    n = String(n == null ? "" : n);
    return n.length > 24 ? n.slice(0, 23) + "…" : n;
  }

  function growthHtml() {
    var q = Q();
    var g = q.growth;
    if (!g) return "";
    var W = 560, rowH = 46, labelW = 190, max = g.max || 10;
    var gopts = allOptions();
    var H = gopts.length * rowH + 26;
    var bw = function (v) { return Math.max(2, Math.round(((v == null ? 5 : v) / max) * (W - labelW - 40))); };
    var html = '<div class="chart"><div class="chart-title">' + esc(g.title) + "</div>" +
      '<svg class="growth" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(g.title) + '">';
    for (var i = 0; i < gopts.length; i++) {
      var o = gopts[i];

      var isPick = state.picked === o.value;
      html += '<text x="0" y="' + (y + 18) + '" font-size="12" style="fill:var(--ink-2)"><title>' + esc(o.name) + "</title>" + esc(chartName(o.name)) + "</text>" +
        '<rect x="' + labelW + '" y="' + y + '" width="' + bw(o.mNow) + '" height="12" rx="3" style="fill:var(--line)"/>' +
        '<rect x="' + labelW + '" y="' + (y + 16) + '" width="' + bw(o.mLater) + '" height="12" rx="3" style="fill:' +
        (isPick ? "var(--accent)" : "var(--ink-2)") + '" opacity="' + (isPick ? "1" : "0.35") + '"/>';
    }
    var ly = gopts.length * rowH + 14;
    html += '<rect x="' + labelW + '" y="' + ly + '" width="12" height="12" rx="3" style="fill:var(--line)"/>' +
      '<text x="' + (labelW + 18) + '" y="' + (ly + 11) + '" font-size="11" style="fill:var(--ink-2)">' + esc(g.now) + "</text>" +
      '<rect x="' + (labelW + 110) + '" y="' + ly + '" width="12" height="12" rx="3" style="fill:var(--accent)"/>' +
      '<text x="' + (labelW + 128) + '" y="' + (ly + 11) + '" font-size="11" style="fill:var(--ink-2)">' + esc(g.later) + "</text>";
    var picked = optBy(state.picked);
    var caption = picked
      ? "Your pick: " + picked.name + " — follow its second bar. That's the future you're signing."
      : "Pick an option above and its future bar highlights here.";
    return html + '</svg><div class="chart-note">' + esc(caption) + " Shapes, not forecasts.</div></div>";
  }

  function microHtml(q, o) {

  function quickHtml() {

      '<div class="edu"><h2>' + esc(q.title) + '</h2><div class="quick-pick">';

        "<b>" + '<span class="onum">' + (i + 1) + "</span>" + esc(q.options[i].name) + "</b><small>" + esc(q.options[i].desc) + "</small></button>";

    if (state.err) html += '<p class="err">' + esc(state.err) + "</p>";
    html += '<div class="escape-row"><span>Not sold?</span>';
    if (q.agentPick) html += '<button type="button" class="escape-btn" data-action="delegate">Let the agent decide</button>';
    if (!q.noAbandon) html += '<button type="button" class="escape-btn" data-action="escape" data-v="chat">Back to chat</button>';
    html += '<button type="button" class="escape-btn" data-action="escape" data-v="skip">' + (CTX.kind === "decide" ? "Decide later" : "Skip question") + "</button></div>";

  }

  function answerLabel(ans) {
    if (!ans) return "Still open";
    if (ans.custom) return ans.name + " (your proposal)";
    return ans.name + " · " + (ans.path === "hoist" ? "compared" : "quick") + (ans.mode === "delegated" ? " · agent" : "");
  }

  function reviewRows() {
    var rows = [];
    for (var i = 0; i < PACKS.length; i++) {
      var q = PACKS[i];
      var a = state.answers[q.id];
      if (a) rows.push({ id: q.id, title: q.title, label: answerLabel(a), done: true, changeable: true });
      else if (state.abandoned[q.id]) rows.push({ id: q.id, title: q.title, label: "Sent back to chat — your agent will ask there", done: true, changeable: true });
      else if (state.skipped[q.id]) rows.push({ id: q.id, title: q.title, label: "Skipped — deferred", done: true, changeable: true });
      else rows.push({ id: q.id, title: q.title, label: "Still open", done: false, changeable: !q.preparing });
    }
    var defs = defaultRows();
    for (var j = 0; j < defs.length; j++) rows.push(defs[j]);
    return rows;
  }

  function reviewHtml() {
    var rows = reviewRows();
    var html = msgHtml("agent", "Every moment is decided — <strong>review the set, then commit it:</strong>") +
      '<div class="edu">';
    var allDone = true;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (!r.done) allDone = false;
      html += '<div class="rev-row"><div><b>' + esc(r.title) + "</b>" +
        '<span class="rev-a">' + esc(r.label) + "</span></div>" +
        (r.changeable ? '<button type="button" class="escape-btn" data-action="change" data-v="' + esc(r.id) + '">' +
          (r.done ? "Change" : "Answer") + "</button>" : "") + "</div>";
    }
    html += "</div>";
    if (state.err) html += '<p class="err">' + esc(state.err) + "</p>";
    html += '<div class="actions"><button type="button" class="btn" data-action="file"' +
      (allDone ? "" : " disabled") + ">Commit &amp; send back to chat</button></div>";
    if (!allDone) html += '<p class="q-hint">Answer or skip every moment to commit the set. Nothing is written yet.</p>';
    return html;
  }

  function recordHtml() {
    var filed = 0, deferred = 0;
    for (var i = 0; i < PACKS.length; i++) {
      if (state.answers[PACKS[i].id]) filed++;
      else if (state.skipped[PACKS[i].id]) deferred++;
    }
    var html = msgHtml("agent", "Committed <strong>" + filed + " moment" + (filed === 1 ? "" : "s") + "</strong>" +
      (deferred ? " — <strong>" + deferred + " deferred</strong>" : "") + ". Here's the set:") +
      '<div class="record-wrap">';
    for (var j = 0; j < PACKS.length; j++) {
      var q = PACKS[j];
      var a = state.answers[q.id];
      var rec = state.records[q.id];
      if (a && rec && rec.markdown) {
        html += '<div class="record-q"><strong>' + esc(q.title) + "</strong>" +
          '<pre class="record">' + esc(rec.markdown) + "</pre></div>";
      } else if (a) {
        html += '<div class="deferred-note"><strong>' + esc(q.title) + " — " + esc(a.name) + ".</strong> " +
          (rec && rec.record ? "Saved as " + esc(rec.record) + "." : "") + "</div>";
      } else if (state.abandoned[q.id]) {
        html += '<div class="deferred-note"><strong>' + esc(q.title) + " — sent back to chat.</strong> " +
          "No choice made; your agent will ask there instead.</div>";
      } else if (state.skipped[q.id]) {
        html += '<div class="deferred-note"><strong>' + esc(q.title) + " — deferred.</strong> " +
          "No choice made; this moment stays open for later." +
          (rec && rec.record ? " Placeholder saved as " + esc(rec.record) + "." : "") + "</div>";
      }
    }
    var defs = defaultRows();
    for (var k = 0; k < defs.length; k++) {
      html += '<div class="deferred-note"><strong>' + esc(defs[k].title) + " — default stands.</strong> " + esc(defs[k].label) + "</div>";
    }
    html += '<button type="button" class="restart" data-action="restart">' +
      (CTX.kind === "decide" ? "Back to start" : "Start another task") + "</button></div>";
    return html;
  }

  function hyperHtml(o) {
    var q = Q();
    var idx = 0, all = allOptions();
    for (var k = 0; k < all.length; k++) if (all[k].value === o.value) idx = k + 1;
    var ddg = "https://duckduckgo.com/?q=" + encodeURIComponent(o.name + " " + q.decision);
    var html = '<div class="veil" data-action="hyperclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(o.name) + ' hyper dive">';
    html += '<div class="sheet-top"><div><h2><span class="onum">' + idx + "</span>" + esc(o.name) + '</h2><p class="sub">' + esc(o.desc) + "</p></div>" +
      '<button type="button" class="x-btn" data-action="hyperx">Close</button></div>';
    html += '<div class="sheet-sec">The story</div><p class="sheet-story">' + esc(o.why) + "</p>";
    if (o.journey && o.journey.length) html += '<div class="sheet-sec">How it works</div>' + journeyHtml(o);
    var deep = deepHtml(o);
    if (deep) html += '<div class="sheet-sec">Numbers and trade-offs</div>' + deep;
    if (CTX.kind === "session" && q.draft && !deepReady(q)) { html += deepPullHtml(q); triggerDeep(q); }
    if (o.living) html += '<div class="sheet-sec">Living with it</div><p class="sheet-story">' + esc(o.living) + "</p>";
    html += '<div class="sheet-sec">Keep learning</div><ul class="learn-list">';
      for (var i = 0; i < q.links.length; i++) {
        html += '<li><a href="' + esc(q.links[i].u) + '" target="_blank" rel="noopener">' + esc(q.links[i].t) + "</a></li>";
      }
      html += '<li><a href="' + esc(ddg) + '" target="_blank" rel="noopener">Search the web for ' + esc(o.name) + "</a></li></ul>";
    html += '<div class="sheet-actions">' +
      '<button type="button" class="btn" data-action="hyperpick" data-v="' + esc(o.value) + '">Choose ' + esc(o.name) + "</button></div>";
    return html + "</div></div>";
  }
  function openHyper(v) {
    if (!optBy(v)) return;
    state.hyper = v;
    render();
    if (document.querySelector) {
      var c = document.querySelector(".sheet .x-btn");
      if (c && c.focus) c.focus();
    }
  }
  function closeHyper() { state.hyper = null; render(); }

  function switchQ(id) {
    var ok = false;
    for (var i = 0; i < PACKS.length; i++) if (PACKS[i].id === id) ok = true;
    if (!ok) return;
    state.qid = id;
    state.phase = "moment";
    state.path = null;
    state.picked = null;
    state.showCustom = false;
    state.hyper = null;
    state.err = null;
    render();
  }
  function choosePath(p) {
    if (p !== "hoist" && p !== "quick") return;
    var q = Q();
    if (q.preparing) return;
    state.path = p;
    state.phase = p;
    state.picked = null;
    state.showCustom = false;
    state.hyper = null;
    state.err = null;
    render();
  }
  function pick(v) {
    var q = Q();
    if (q.preparing || !optBy(v)) return;
    state.picked = (state.picked === v) ? null : v;
    render();
  }
  function currentAnswer() {
    var o = optBy(state.picked);
    if (!o) return null;
    return { name: o.name, value: o.value, custom: !!o.added, path: state.path };
  }
  function nextUnanswered() {
    for (var i = 0; i < PACKS.length; i++) {
      var id = PACKS[i].id;
      if (!state.answers[id] && !state.skipped[id] && !PACKS[i].preparing) return id;
    }
    return null;
  }
  function advance() {
    var next = nextUnanswered();
    state.picked = null; state.showCustom = false; state.hyper = null; state.err = null;
    if (next) { state.qid = next; state.phase = "moment"; state.path = null; }
    else state.phase = "review";
    render();
  }
  function confirm(mode) {
    var a = currentAnswer();
    if (!a) return;
    var q = Q();
    var opt = optBy(a.value);
    mode = mode || "chosen";
    state.err = null;
    render();
    saveChoice(q, opt, mode, state.path).then(function (rec) {
      state.answers[q.id] = { name: opt.name, value: opt.value, custom: !!opt.added, path: state.path, mode: mode };
      state.records[q.id] = rec;
      delete state.skipped[q.id];
      delete state.abandoned[q.id];
      advance();
    }).catch(function (e) {
      state.err = (e && e.message) || "Couldn't save.";
      render();
    });
  }
  function skipQuestion() {
    var q = Q();
    state.err = null;
    render();
    saveParked(q).then(function (rec) {
      delete state.answers[q.id];
      state.skipped[q.id] = true;
      delete state.abandoned[q.id];
      state.records[q.id] = rec;
      advance();
    }).catch(function (e) {
      state.err = (e && e.message) || "Couldn't save.";
      render();
    });
  }
  function abandon() {
    var q = Q();
    if (q.noAbandon) return;
    state.err = null;
    render();
    saveAbandoned(q).then(function () {
      delete state.answers[q.id];
      state.skipped[q.id] = true;
      state.abandoned[q.id] = true;
      advance();
    }).catch(function (e) {
      state.err = (e && e.message) || "Couldn't save.";
      render();
    });
  }
  function delegate() {
    var q = Q();
    if (!q.agentPick || !optBy(q.agentPick)) return;
    state.picked = q.agentPick;
    confirm("delegated");
  }
  function doEscape(kind) {
    if (kind === "chat") { abandon(); return; }
    if (kind === "skip") { skipQuestion(); return; }
    if (kind === "custom") {
      state.showCustom = true;
      state.err = null;
      render();
      var el = $("custom-input");
      if (el && el.focus) el.focus();
    }
  }
  function propose() {
    var el = $("custom-input");
    var v = el && el.value ? el.value.trim().slice(0, 120) : "";
    if (!v) return;
    var qid = state.qid;
    var arr = state.added[qid] || (state.added[qid] = []);
    var chal = { value: "x-" + qid + "-" + arr.length, name: v, added: true,
      desc: "Added by you · needs research.",
      why: "Your proposal — standing on your judgment until researched.",
      journey: ["You propose it", "Blanks get flagged", "You verify", "Then it competes"],
      numbers: [["Status", "Unresearched — verify me"], ["Confidence", "Low until researched"]],
      unlocks: ["Your instinct, captured"], watch: ["Unverified claims"],
      cost: "Unknown — needs research.", reversibility: "Unknown.",
      micro: 5, mNow: 5, mLater: 5 };
    arr.push(chal);
    state.showCustom = false;
    state.picked = chal.value;
    render();
  }
  function dropChallenger() {
    var o = optBy(state.picked);
    if (!o || !o.added) return;
    var arr = state.added[state.qid] || [];
    for (var i = 0; i < arr.length; i++) if (arr[i].value === o.value) arr.splice(i, 1);
    state.picked = null;
    render();
  }
  function changeQ(id) {
    var ok = false;
    for (var i = 0; i < PACKS.length; i++) if (PACKS[i].id === id) ok = true;
    if (!ok) return;
    var a = state.answers[id];
    state.qid = id; state.phase = "hoist"; state.path = "hoist"; state.hyper = null;
    state.picked = a ? a.value : null;
    state.showCustom = false;
    state.err = null;
    render();
  }
  function fileRecords() {
    var rows = reviewRows();
    for (var i = 0; i < rows.length; i++) if (!rows[i].done) return;
    state.err = null;
    render();
    var done = function () { state.phase = "record"; render(); };
    var fail = function (e) { state.err = (e && e.message) || "Couldn't file."; render(); };
    if (CTX.kind === "session") fileDefaults().then(done, fail);
    else done();
  }

  function post(url, body) {
    return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(j.error || "Request failed"); });
        return r.json();
      });
  }

  function loadState() {
    return fetch("/api/state", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("bad state");
      return r.json();
    }).then(function (j) {
      S = j; LIVE = true;
      var off = $("offline");
      if (off) off.classList.remove("on");
    }).catch(function () {
      if (LIVE) {
        var off = $("offline");
        if (off) off.classList.add("on");
        return;
      }
      return fetch("sample.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
        S = j; LIVE = false;
      });
    });
  }

  function ensureCAT() {
    if (CAT) return Promise.resolve(CAT);

        var slug = slugify(d.title + " default");
        if (LIVE) {
          return post("/api/session/decisions/" + d.id, { choice: d.default, mode: "default", slug: slug, markdown: md }).then(function (s) { S.session = s; });
        }
        var file = nextLocalFile(slug);
        S.records.push({ file: file, markdown: md });
        S.session.outcomes[d.id] = { choice: d.default, mode: "default", record: "docs/decisions/" + file };
        return null;
      });
    });
    return chain;
  }

  var EXAMPLES = ["Add user accounts with saved projects",
    "Set up color tokens and theming for our design system",
    "Add analytics to see where customers drop off during checkout"];

  function startHtml() {
    var html = msgHtml("agent", "Tell me the task — I'll find every choice that's hard to undo, and we'll take each <strong>decision moment</strong> together.") +
      '<div class="edu"><h2>What are we deciding?</h2>' +
      '<p class="q-hint">Your agent reads the project and Muse Spark prepares each moment. Expand anything, hyper-dive anywhere, then pick.</p>' +
      '<textarea class="task-input" id="taskIn" aria-label="Task">' + (LIVE ? "" : esc(EXAMPLES[0])) + "</textarea>" +
      '<div class="ex-row">' + EXAMPLES.map(function (e) {
        return '<button type="button" class="escape-btn" data-action="ex" data-v="' + esc(e) + '">' + esc(e) + "</button>";
      }).join("") + "</div>" +
      '<div class="actions"><button type="button" class="btn" data-action="start">Start deciding together</button></div>' +
      (state.err ? '<p class="err">' + esc(state.err) + "</p>" : "") + "</div>";
    return html;
  }

  function progressHtml(ses) {
    var total = ses.total || 0, n = (ses.drafted || []).length;
    var line = ses.status === "planning" ? "Reading your project and finding the decision moments…"
      : "Preparing moment " + Math.min(n + 1, total || 1) + " of " + (total || "?") + " — deciding starts with the first moment.";
    return msgHtml("agent", "Working on <strong>" + esc(ses.task || "") + ".</strong>") +
      '<div class="edu"><div class="researching">' + esc(line) + TYPING + "</div>" +
      '<p class="q-hint">Muse Spark writes the questions and options; Hoist checks every draft against its rules before you see it.</p></div>';
  }

  function errorHtml(ses) {
    return msgHtml("agent", "Muse Spark <strong>couldn't finish</strong> preparing the decision moments.") +
      '<div class="edu"><p class="q-hint">Try again picks up where it stopped and keeps what is already written. Your agent is still waiting.' +
      (ses.error ? " Details: " + esc(ses.error) : "") + "</p>" +
      '<div class="actions"><button type="button" class="btn" data-action="retry">Try again</button></div>' +
      (state.err ? '<p class="err">' + esc(state.err) + "</p>" : "") + "</div>";
  }

  function startSession(task, resume) {
    task = (task || "").trim();
    if (!task) { state.err = "Describe the task first."; render(); return; }
    state.err = null;
    resetState();
    if (LIVE) {
      render();
      post("/api/session", { task: task, resume: !!resume }).then(function (ses) {
        S.session = ses;
        render();
      }).catch(function (e) {
        state.err = (e && e.message) || "Couldn't start.";
        render();
      });
      return;
    }
    var base = JSON.parse(JSON.stringify(S.sample_session));
    var ids = base.plan.decisions.filter(function (d) { return d.mode === "ask"; }).map(function (d) { return d.id; });
    SIM = { task: task, status: "planning", plan: null, drafts: {}, drafted: [], total: ids.length, outcomes: {} };
    render();
    var step = function (ms) { return new Promise(function (res) { setTimeout(res, ms); }); };
    step(1400).then(function () {
      SIM.status = "drafting"; SIM.plan = base.plan;
      buildSessionPacks();
      if (!state.qid && PACKS.length) state.qid = PACKS[0].id;
      render();
      var chain = Promise.resolve();
      ids.forEach(function (id, i) {
        chain = chain.then(function () {
          return step(1200).then(function () {
            SIM.drafts[id] = base.drafts[id];
            SIM.drafted.push(id);
            buildSessionPacks();
            render();
          });
        });
      });
      return chain;
    }).then(function () {
      return step(300);
    }).then(function () {
      S.session = { task: base.task, status: "ready", plan: base.plan, drafts: base.drafts,
        drafted: ids.slice(), total: ids.length, profile_answers: {}, answers: {}, outcomes: {} };
      SIM = null;
      buildSessionPacks();
      if (!state.qid && PACKS.length) state.qid = PACKS[0].id;
      if ((location.hash || "") === "#/session") render();
    });
  }

  function engineHtml() {
    var lede = CTX.kind === "decide" ? "One hard choice. Expand, compare, commit — one record at the end."
      : "One moment per hard choice. Expand, compare, commit — one record at the end.";
    var html = '<p class="lede">' + esc(lede) + "</p>" +
      '<div class="qtabs" role="group" aria-label="Question">' + tabsHtml() + "</div>";
    if (state.phase === "moment") html += momentHtml();
    else if (state.phase === "hoist") html += hoistHtml();
    else if (state.phase === "quick") html += quickHtml();
    else if (state.phase === "review") html += reviewHtml();
    else if (state.phase === "record") html += recordHtml();
    return html;
  }

  function sessionHtml() {
    var ses = S.session || SIM;
    if (!ses) return startHtml();
    if (ses.status === "error") return errorHtml(ses);
    if (ses.status === "planning" || (ses.status === "drafting" && !ses.plan)) return progressHtml(ses);
    buildSessionPacks();
    if (!PACKS.length) return progressHtml(ses);
    if (!state.qid || !PACKS.some(function (q) { return q.id === state.qid; })) {
      var first = null, any = null;
      for (var i = 0; i < PACKS.length; i++) {
        if (state.answers[PACKS[i].id] || state.skipped[PACKS[i].id]) continue;
        if (!any) any = PACKS[i].id;
        if (!PACKS[i].preparing) { first = PACKS[i].id; break; }
      }
      state.qid = first || any || PACKS[0].id;
    }
    return engineHtml();
  }

  function homeHtml() {
    var open = (S.decisions || []).filter(function (d) { return d.status === "open"; });
    var ses = S.session;
    var html = msgHtml("agent", "Hoist holds your <strong>decision moments</strong> — the choices that are hard to undo. Pick one up, or walk a whole task.") +
      '<div class="edu"><h2>Open now</h2><p class="q-hint">Single interruptions land here; task sessions walk question by question.</p>';
    if (!open.length && !ses) html += '<p class="q-hint">Nothing is waiting. Start a task session to try the walk-through.</p>';
    for (var i = 0; i < open.length; i++) {
      html += '<a class="opt" href="#/decide/' + esc(open[i].id) + '"><b>' + esc(open[i].task || open[i].kind) + "</b><small>" +
        esc("Single decision · waiting on you") + "</small></a>";
    }
    if (ses && ses.plan) {
      var asks = ses.plan.decisions.filter(function (d) { return d.mode === "ask"; });
      var left = asks.filter(function (d) { return !(ses.outcomes || {})[d.id]; }).length;
      html += '<a class="opt" href="#/session"><b>' + esc(ses.task || "Task session") + "</b><small>" +
        esc(ses.status === "ready" ? left + " of " + asks.length + " left to decide" : "Muse Spark is preparing it…") + "</small></a>";
    } else if (ses) {
      html += '<a class="opt" href="#/session"><b>' + esc(ses.task || "Task session") + "</b><small>Muse Spark is preparing it…</small></a>";
    }
    html += '<a class="opt" href="#/session"><b>Start a task session</b><small>Describe a task; decide its hard parts well.</small></a>';
    html += "</div>";
    return html;
  }

  function recordsHtml() {
    var recs = (S.records || []).slice().reverse();
    var html = '<p class="lede">Every saved decision, newest first.</p><div class="edu"><h2>Decision records</h2>';
    if (!recs.length) html += '<p class="q-hint">No records yet. Finish a walk-through and they land here.</p>';
    for (var i = 0; i < recs.length; i++) {
      var title = "Record";
      var m = /^#\s+(.+)$/m.exec(recs[i].markdown || "");
      if (m) title = m[1];
      html += '<a class="opt" href="#/records/' + esc(recs[i].file) + '"><b>' + esc(title) + "</b><small>" + esc(recs[i].file) + "</small></a>";
    }
    return html + "</div>";
  }

  function recordOneHtml(param) {
    var rec = null;
    (S.records || []).forEach(function (r) {
      if (r.file === param || (r.file || "").indexOf(param) === 0) rec = r;
    });
    if (!rec) return msgHtml("agent", "No record by that name.") + '<div class="edu"><a class="opt" href="#/records"><b>All records</b></a></div>';
    return msgHtml("agent", "Saved as <strong>" + esc(rec.file) + ".</strong>") +
      '<div class="record-wrap"><pre class="record">' + esc(rec.markdown || "") + "</pre>" +
      '<a class="opt" href="#/records"><b>All records</b></a></div>';
  }

  function render() {
    var h = (typeof location !== "undefined" && location.hash) || "#/";
    var nav = function (id, on) { var el = $(id); if (el) { if (on) el.classList.add("on"); else el.classList.remove("on"); } };
    var app = $("app");
    if (!app) return;
    if (h.indexOf("#/decide/") === 0) {
      nav("nav-home", true); nav("nav-session", false); nav("nav-records", false);
      var id = h.slice(9);
      var dec = null;
      (S.decisions || []).forEach(function (x) { if (x.id === id) dec = x; });
      if (!dec) { app.innerHTML = msgHtml("agent", "No decision by that name.") + '<div class="edu"><a class="opt" href="#/"><b>Open now</b></a></div>'; paintModal(); return; }
      if (dec.status !== "open") {
        var rec = null;
        (S.records || []).forEach(function (r) { if (dec.record && (dec.record || "").indexOf(r.file) !== -1) rec = r; });
        app.innerHTML = msgHtml("agent", "This one is <strong>decided.</strong>") + '<div class="record-wrap">' +
          (rec ? '<pre class="record">' + esc(rec.markdown || "") + "</pre>" : '<p class="q-hint">Saved as ' + esc(dec.record || "") + ".</p>") +
          '<a class="opt" href="#/"><b>Open now</b></a></div>';
        paintModal();
        return;
      }
      if (!CAT) { app.innerHTML = progressHtml({ task: "Loading the decision…", status: "planning", total: 1, drafted: [] }); paintModal(); return; }
      if (CTX.kind !== "decide" || CTX.id !== id || !PACKS.length) { CTX = { kind: "decide", id: id }; buildDecidePack(dec); resetState(); state.qid = PACKS[0].id; }
      app.innerHTML = engineHtml();
      paintModal();
      return;
    }
    if (h.indexOf("#/records/") === 0) {
      nav("nav-home", false); nav("nav-session", false); nav("nav-records", true);
      app.innerHTML = recordOneHtml(decodeURIComponent(h.slice(10)));
      paintModal();
      return;
    }
    if (h === "#/records") {
      nav("nav-home", false); nav("nav-session", false); nav("nav-records", true);
      app.innerHTML = recordsHtml();
      paintModal();
      return;
    }
    if (h === "#/session") {
      nav("nav-home", false); nav("nav-session", true); nav("nav-records", false);
      if (CTX.kind !== "session") { CTX = { kind: "session" }; resetState(); buildSessionPacks(); restoreFromOutcomes(); }
      app.innerHTML = sessionHtml();
      paintModal();
      return;
    }
    nav("nav-home", true); nav("nav-session", false); nav("nav-records", false);
    app.innerHTML = homeHtml();
    paintModal();
  }

  function paintModal() {
    var mo = $("modal");
    if (mo) mo.innerHTML = (state.hyper && optBy(state.hyper) && (state.phase === "hoist" || state.phase === "quick")) ? hyperHtml(optBy(state.hyper)) : "";
    if (!state.hyper && mo) mo.innerHTML = "";
  }

  function onClick(ev) {
    var t = ev.target && ev.target.closest ? ev.target.closest("[data-action]") : null;
    if (!t) return;
    var action = t.getAttribute("data-action");
    var v = t.getAttribute("data-v");
    if (action === "q") switchQ(v);
    else if (action === "path") choosePath(v);
    else if (action === "pick") pick(v);
    else if (action === "quickpick") { pick(v); confirm("chosen"); }
    else if (action === "escape") doEscape(v);
    else if (action === "delegate") delegate();
    else if (action === "propose") propose();
    else if (action === "drop") dropChallenger();
    else if (action === "deepretry") { state.deepTried[v] = null; state.deepErr[v] = null; render(); }
    else if (action === "review") { state.phase = "review"; state.err = null; render(); }
    else if (action === "change") changeQ(v);
    else if (action === "file") fileRecords();
    else if (action === "confirm") confirm("chosen");
    else if (action === "restart") {
      if (CTX.kind === "decide") { location.hash = "#/"; return; }
      S.session = null; SIM = null;
      CTX = { kind: "session" }; resetState();
      render();
    }
    else if (action === "hyper") openHyper(v);
    else if (action === "hyperx") closeHyper();
    else if (action === "hyperclose") {
      if (ev.target && ev.target.closest && ev.target.closest(".sheet")) return;
      closeHyper();
    }
    else if (action === "hyperpick") { if (optBy(v)) { state.hyper = null; state.picked = v; confirm("chosen"); } }
    else if (action === "ex") { var el = $("taskIn"); if (el) el.value = v; }
    else if (action === "start") { var ti = $("taskIn"); startSession(ti ? ti.value : "", false); }
    else if (action === "retry") startSession((S.session || {}).task || "", true);
  }

  function loadTheme() {
    var saved = null;
    try { saved = window.localStorage ? window.localStorage.getItem("hoist-theme") : null; } catch (e) { saved = null; }
    if (saved === "light" || saved === "dark") return saved;
    if (typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
    return "light";
  }
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", state.theme);
    var btn = $("theme-toggle");
    if (btn) btn.textContent = "Theme: " + (state.theme === "dark" ? "Dark" : "Light");
    try { if (window.localStorage) window.localStorage.setItem("hoist-theme", state.theme); } catch (e) { /* private mode */ }
  }
  function toggleTheme() {
    state.theme = state.theme === "dark" ? "light" : "dark";
    applyTheme();
  }

  function needCAT() {
    return ((typeof location !== "undefined" && location.hash) || "").indexOf("#/decide/") === 0 && !CAT;
  }

  function boot() {
    state.theme = loadTheme();
    applyTheme();
    loadState().then(function () {
      if (!S) {
        $("app").innerHTML = '<p class="err">Couldn\'t load the decisions. If you opened this file directly, run <code>python3 hoist.py serve</code> and open the address it prints.</p>';
        return;
      }
      render();
      if (needCAT()) ensureCAT().then(render, render);
      document.addEventListener("click", onClick);
      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && state.hyper) closeHyper();
      });
      window.addEventListener("hashchange", function () {
        if (needCAT()) ensureCAT().then(render, render);
        else render();
      });
      var tb = $("theme-toggle");
      if (tb && tb.addEventListener) tb.addEventListener("click", toggleTheme);
      setInterval(function () {
        var ses = S.session;
        var busy = !!SIM || (ses && (ses.status === "planning" || ses.status === "drafting"));
        if (!busy || !LIVE) return;
        var before = JSON.stringify([ses && ses.status, ses && ses.drafted, (S.decisions || []).map(function (d) { return d.id + d.status; })]);
        loadState().then(function () {
          var after = JSON.stringify([S.session && S.session.status, S.session && S.session.drafted,
            (S.decisions || []).map(function (d) { return d.id + d.status; })]);
          if (after !== before) render();
        });
      }, 1500);
    });
  }

  window.__hoist = { state: state, boot: boot, render: render, packs: function () { return PACKS; }, chartName: chartName,
    switchQ: switchQ, choosePath: choosePath, pick: pick,
    confirm: confirm, propose: propose, startSession: startSession, ctx: function () { return CTX; } };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
