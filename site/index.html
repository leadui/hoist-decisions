<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hoist: when a coding agent reaches a decision that is hard to undo, Hoist explains the options, you decide, and the decision is recorded.">
<title>Hoist Decision Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column. Views: decide (ask → recommend → recorded), records list, one readable record. Evidence in a side sheet. */
:root{
  color-scheme:light;
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#16201C; --muted:#56635D; --faint:#86918C; --line:#DBE1DE; --soft:#ECF0EE;
  --accent:#0F7657; --accent-soft:#DFF0E8; --accent-ink:#FFFFFF;
  --oneway:#B0443D; --oneway-soft:#F6E3E1; --heavy:#94621A; --heavy-soft:#F5EAD7; --scrim:rgba(22,32,28,.28);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#151C19; --ink:#E2E9E5; --muted:#9BA8A2; --faint:#6C7973; --line:#26302C; --soft:#1B2420;
  --accent:#52C49B; --accent-soft:#15342A; --accent-ink:#04130D;
  --oneway:#E68B83; --oneway-soft:#3A1F1C; --heavy:#E2B062; --heavy-soft:#33280F; --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#151C19; --ink:#E2E9E5; --muted:#9BA8A2; --faint:#6C7973; --line:#26302C; --soft:#1B2420;
  --accent:#52C49B; --accent-soft:#15342A; --accent-ink:#04130D;
  --oneway:#E68B83; --oneway-soft:#3A1F1C; --heavy:#E2B062; --heavy-soft:#33280F; --scrim:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font-family:var(--mono);font-weight:500;font-size:15px;text-decoration:none}
.proj{color:var(--muted);font-size:13.5px}
.sample{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--heavy);background:var(--heavy-soft);border-radius:999px;padding:1px 8px}
nav.tabs{margin-left:auto;display:flex;gap:4px}
nav.tabs a{font-size:13.5px;color:var(--muted);text-decoration:none;padding:5px 11px;border-radius:999px;display:inline-flex;gap:7px;align-items:center}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.count{font-family:var(--mono);font-size:11px;color:var(--heavy);background:var(--heavy-soft);border-radius:999px;padding:0 7px}

.wrap{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px 72px}
@media (max-width:640px){.wrap{padding-block:24px 48px}}
.step{display:flex;flex-direction:column;gap:22px;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.step.still{animation:none}
.status{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--heavy);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--heavy);opacity:0;animation:breathe 2.4s var(--ease) infinite}
.dot.ok{background:var(--accent)} .dot.ok::after{border-color:var(--accent)}
@keyframes breathe{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.7);opacity:0}}
h1{font-size:clamp(28px,4.4vw,38px);line-height:1.1;letter-spacing:-.025em;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0}
.lead{font-size:17px;color:var(--muted);margin:0;max-width:58ch;text-wrap:pretty}
.lead b{color:var(--ink);font-weight:500}
code{font-family:var(--mono);font-size:.88em;background:var(--soft);padding:1px 6px;border-radius:5px;color:var(--ink)}
.known{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 10px;font-size:12.5px;color:var(--ink)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--accent)}

.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px}
.qnum{font-family:var(--mono);font-size:12px;color:var(--faint)}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:3px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ink)}
.qtext{font-size:21px;font-weight:500;letter-spacing:-.01em;margin:0}
.qwhy{font-size:14px;color:var(--faint);margin:-12px 0 0}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:16px;transition:border-color .2s var(--ease),transform .15s var(--ease)}
.ans:hover{border-color:var(--faint)}
.ans:active{transform:scale(.99)}
.ans .key{font-family:var(--mono);font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:5px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.ans.sel{border-color:var(--ink)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.link:hover{color:var(--ink);text-decoration-color:var(--ink)}

.rec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.rec .why{font-size:16.5px;margin:0;max-width:56ch}
.accept{display:flex;gap:10px;font-size:15px;color:var(--muted);padding-top:14px;border-top:1px solid var(--line)}
.accept b{color:var(--ink);font-weight:500;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn svg{width:16px;height:16px}
.small{font-size:14px;color:var(--muted);margin:0}
.lv{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;background:var(--heavy-soft);color:var(--heavy)}
.lv.high{background:var(--accent-soft);color:var(--accent)}
.lv.low{background:var(--oneway-soft);color:var(--oneway)}
.err{font-size:14px;color:var(--oneway);margin:0}

.others h2{font-size:13px;font-weight:500;color:var(--faint);margin:0 0 8px}
.other{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.other:first-of-type{border-top:0}
.other .n{font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.other .d{font-size:14px;color:var(--muted);grid-column:1/2}
.other .acts{grid-row:1/3;grid-column:2;display:flex;gap:12px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--heavy-soft);color:var(--heavy)}
.ruled{font-size:13.5px;color:var(--faint);margin:6px 0 0}

/* records */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;transition:border-color .2s var(--ease)}
.item:hover{border-color:var(--faint)}
.item .t{font-weight:500;font-size:16px}
.item .s{font-size:14px;color:var(--muted);grid-column:1/2}
.item .m{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.item.wait{border-color:var(--heavy);background:var(--heavy-soft)}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.accepted{background:var(--accent-soft);color:var(--accent)}
.pill.proposed,.pill.waiting{background:var(--heavy-soft);color:var(--heavy)}
.pill.superseded{background:var(--soft);color:var(--faint)}
.pill.d3{color:var(--oneway);border:1px solid var(--oneway-soft)}
.pill.d2{color:var(--heavy);border:1px solid var(--heavy-soft)}
.pill.d1{color:var(--accent);border:1px solid var(--accent-soft)}
.date{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:24px;color:var(--muted);font-size:15px}

.back{font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.short{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 22px}
.short div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid var(--line);font-size:15.5px}
.short div:first-child{border-top:0}
.short b{font-weight:500;color:var(--faint);font-size:13.5px}
@media (max-width:520px){.short div{grid-template-columns:minmax(0,1fr);gap:2px}}
.people{font-size:14px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap}
.people b{color:var(--ink);font-weight:500}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:13px;font-weight:500;color:var(--faint);letter-spacing:0}
.sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sec li{font-size:15px;display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;align-items:baseline}
.sec li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);margin-top:8px}
.sec li.good::before{background:var(--accent)} .sec li.bad::before{background:var(--oneway)}
.sec li.todo::before{width:9px;height:9px;border-radius:2px;background:none;border:1.5px solid var(--faint);margin-top:6px}
.sec p{margin:0;font-size:15px}
.opt{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.opt h3{margin:0;font-size:15.5px;font-weight:500;display:flex;gap:8px;align-items:center}
details.more summary{cursor:pointer;font-size:14px;color:var(--muted)}
details.more[open] summary{margin-bottom:10px}
pre.adr{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;white-space:pre-wrap;word-break:break-word;max-height:480px;overflow:auto;margin:0}

/* session */
.newbie{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
.newbie input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.task{width:100%;min-height:84px;font:inherit;font-size:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
.task:focus{outline:2px solid var(--accent);outline-offset:1px}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.examples button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.examples button:hover{color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;align-items:start;font-size:15.5px;color:var(--faint)}
.steps li.on{color:var(--ink)} .steps li.ok{color:var(--muted)}
.steps .ic{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);margin-top:3px;display:grid;place-items:center}
.steps li.ok .ic{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps li.ok .ic svg{width:12px;height:12px}
.steps li.on .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps small{display:block;font-size:13px;color:var(--faint)}
.skel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--soft) 0%,var(--line) 50%,var(--soft) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{font-size:13px;font-weight:500;color:var(--faint)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;align-items:center}
.row2 .t{font-weight:500}
.row2 .s{font-size:14px;color:var(--muted);grid-column:1/2}
.row2 .m{grid-row:1/3;grid-column:2}
.row2.quiet{background:transparent}
.note{font-size:14px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 14px;margin:0}
.newnote{font-size:14px;color:var(--accent);margin:-10px 0 0}
.learn{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.learn p{margin:0}
.learn b{font-weight:500}
.learn dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px}
.learn dt{font-weight:500}
.learn dd{margin:0;color:var(--muted)}
.check{font-size:14px;color:var(--heavy);background:var(--heavy-soft);border-radius:8px;padding:8px 12px;margin:0}
.assumes{font-size:14px;color:var(--faint);margin:-8px 0 0}
.wrap.wide{max-width:980px}
.dhead{display:flex;flex-direction:column;gap:8px}
.danalogy{font-family:Georgia,"Iowan Old Style",serif;font-size:19px;line-height:1.5;color:var(--muted);margin:0;max-width:62ch}
.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease);cursor:pointer;text-align:left}
.story:hover{border-color:var(--faint)}
.story.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.story h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.story .tech{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:-6px 0 0}
.story .an{font-family:Georgia,"Iowan Old Style",serif;font-size:16px;line-height:1.5;margin:0}
.story .when{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:14px;color:var(--muted);margin:0}
.story .when b{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);font-weight:400;padding-top:2px}
.story .badges{display:flex;flex-wrap:wrap;gap:6px;min-height:20px}
.story .acts{display:flex;gap:14px;margin-top:auto;padding-top:4px}
.bdg{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.bdg.lean{background:var(--heavy-soft);color:var(--heavy)} .bdg.fit{background:var(--accent-soft);color:var(--accent)}
.concepts{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.concepts h3{margin:0;font-size:16px;font-weight:600}
.reason{background:var(--soft);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.reason h2{font-size:15px;font-weight:600;color:var(--ink);margin:0}
.reason ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.reason li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:baseline}
.reason li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint);margin-top:7px}
.reason li.risk::before{background:var(--oneway)}
.reason .sub{font-size:12px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:4px 0 0}
.assume{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.assume:first-of-type{border-top:0}
.assume .q{font-size:13px;color:var(--faint)}
.assume .a{font-size:15px;font-weight:500}
.assume .basis{font-size:13px;color:var(--muted);grid-column:1/2}
.assume .ctl{grid-row:1/4;grid-column:2;display:flex;gap:8px;align-items:center}
.assume .state{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.assume .state.ok{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1;margin-top:4px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.small-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;font-size:13px}
.dbar{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.refine{width:100%;min-height:70px;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
.offline{max-width:660px;margin:16px auto 0;padding:12px 16px;border-radius:10px;background:var(--oneway-soft);color:var(--oneway);font-size:14px}
.offline code{background:transparent;color:inherit}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:var(--ink);color:var(--surface);font-size:14px;padding:10px 16px;border-radius:10px;transition:transform .4s var(--ease),opacity .3s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);z-index:30}
.toast.on{transform:translate(-50%,0);opacity:1}

.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:20;border:0}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:21;transform:translateX(104%);transition:transform .45s var(--ease);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.on{transform:none}
.sh{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.sh h2{font-size:20px}
.sh p{margin:4px 0 0;font-size:14px;color:var(--muted)}

  --bg:var(--m-bg);--surface:var(--m-surface);--soft:var(--m-surface);--ink:var(--m-ink);--muted:var(--m-ink2);--line:var(--m-line);--accent:var(--m-accent);--accent-ink:var(--m-accink);--accent-soft:var(--m-accsoft);--oneway:#b3362b;--twoway:#8a6d1b}
@media (prefers-color-scheme:dark){.moment{--m-bg:#0e1113;--m-surface:#171c1f;--m-ink:#f0f3f5;--m-ink2:#b9c2cb;--m-line:#2c343b;--m-accent:#5b93ff;--m-accink:#0b1220;--m-accsoft:#16233d}}

.moment .opt:hover{border-color:var(--accent)}

.moment .chart{margin:14px 0 4px}

.moment .growth{display:block;width:100%;height:auto}

.moment .ghost li{margin:3px 0}

.moment .escape-btn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;padding:0;font-family:inherit;text-decoration:underline}

.moment .rev-a{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 12px;cursor:pointer;font-size:12.5px;color:var(--ink);font-family:inherit}
.m-veil{position:fixed;inset:0;background:rgba(10,14,20,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.m-sheet{background:var(--m-bg);color:var(--m-ink);border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px}
.m-sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

</style>

<body>
<header class="bar"><div class="in">
  <a class="mark" href="#/">hoist</a>
  <span class="proj" id="proj"></span>
  <span class="sample" id="sampleTag" hidden>Sample data</span>
  <nav class="tabs" aria-label="Views">
    <a href="#/session" id="tabSession">This task <span class="count" id="sessionCount"></span></a>
    <a href="#/decide" id="tabDecide">Waiting for you <span class="count" id="openCount"></span></a>
    <a href="#/records" id="tabRecords">Decision records</a>
  </nav>
</div></header>

<div class="offline" id="offline" role="alert" hidden>Hoist stopped running, so choices can't be saved. Start it again with <code>python3 hoist.py serve</code> in your project, then reload this page.</div>
<main class="wrap" id="app"><p class="small">Loading decisions…</p></main>

<button class="scrim" id="scrim" aria-label="Close" tabindex="-1"></button>
<aside class="sheet" id="whySheet" role="dialog" aria-modal="true" aria-labelledby="whyTitle" aria-hidden="true">
  <div class="sh"><div><h2 id="whyTitle"></h2><p id="whySub"></p></div><button class="x" id="whyClose" aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
  <div class="sbody" id="whyBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>
<div id="emodal"></div>

<script>
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const DOORS={3:'One-way door',2:'Heavy door',1:'Two-way door'};
const DOORWORD={'one-way':3,'heavy':2,'two-way':1};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const today=()=>new Date().toISOString().slice(0,10);
const app=$('app');
let S=null, CAT=null, LIVE=false;
let F=null; /* the decision flow in progress: {id, A, qi, step, pick, done} */

/* ---------- data ---------- */
async function loadState(){
  try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok){S=await r.json();LIVE=true;$('offline').hidden=true;return;}}catch(e){}
  if(LIVE){$('offline').hidden=false;return;}
  S=await (await fetch('sample.json',{cache:'no-store'})).json();LIVE=false;
}
async function boot(){
  try{
    await loadState();
    CAT=(await (await fetch('catalog.json',{cache:'no-store'})).json()).kinds;
  }catch(e){app.innerHTML='<p class="err">Couldn\'t load the decisions. If you opened this file directly, run <code>python3 hoist.py serve</code> and open the address it prints.</p>';return;}
  $('proj').textContent=S.project||'';
  $('sampleTag').hidden=LIVE;
  addEventListener('hashchange',async()=>{if(LIVE)await loadState();render();});
  if(LIVE)setInterval(async()=>{
    const busy=S.session&&['planning','drafting'].includes(S.session.status);
    if(!busy&&F&&!F.done)return;
    const before=JSON.stringify([S.decisions,S.session&&S.session.status,S.session&&S.session.drafted]);
    await loadState();
    if(JSON.stringify([S.decisions,S.session&&S.session.status,S.session&&S.session.drafted])!==before)render();
  },busyPoll());
  render();
}
const openDecisions=()=>S.decisions.filter(d=>d.status==='open');

/* ---------- engine (deterministic; the numbers only order options) ---------- */
function ans(dec,A){const a={};CAT[dec.kind].questions.forEach(q=>{a[q.id]=q.fact&&dec.facts&&dec.facts[q.id]!=null?dec.facts[q.id]:(A[q.id]??0);});return a;}
function viable(K,k,a){const ko=K.options[k].ko;return !(ko&&a[ko.fact]===ko.equals);}
function model(K,a){
  const w={...K.base},s={};
  K.questions.forEach(q=>{const x=q.a[a[q.id]];if(x&&x.w)for(const f in x.w)w[f]+=x.w[f];});
  for(const k in K.options){s[k]={...K.options[k].s};if(a.host===1&&K.options[k].server)Object.assign(s[k],K.options[k].server);}
  const max=Object.values(w).reduce((x,y)=>x+y,0)*10;
  const r=Object.keys(K.options).filter(k=>viable(K,k,a)).map(k=>({k,t:Object.keys(w).reduce((x,f)=>x+w[f]*s[k][f],0)})).sort((x,y)=>y.t-x.t);
  return{w,s,r,out:Object.keys(K.options).filter(k=>!viable(K,k,a)),close:r.length>1&&(r[0].t-r[1].t)/max<0.04};
}
function deciding(m){const[a,b]=m.r;return Object.keys(m.w).map(f=>({f,imp:m.w[f]*(m.s[a.k][f]-m.s[b.k][f])})).filter(x=>x.imp>0).sort((x,y)=>y.imp-x.imp).slice(0,2);}
function flips(K,a,m){
  const out=[],win=m.r[0].k;
  K.questions.forEach(q=>q.a.forEach((x,i)=>{if(i===a[q.id])return;const m2=model(K,{...a,[q.id]:i});if(m2.r[0].k!==win)out.push({txt:q.alt[i],win:m2.r[0].k});}));
  return out;
}
function confidence(dec,m,mode){
  const seen=Object.keys(dec.facts||{}).length,asked=CAT[dec.kind].questions.filter(q=>!(q.fact&&dec.facts&&dec.facts[q.id]!=null)).length;
  if(mode==='delegated')return{lv:'low',txt:'you didn\'t mind, so Hoist chose'};
  const parts=[`${asked} from your answers`];if(seen)parts.unshift(`${seen} seen in your repo`);
  if(m.close)return{lv:'medium',txt:parts.join(', ')+'; the runner-up is close'};
  return{lv:'high',txt:parts.join(', ')};
}

/* ---------- routing ---------- */
function render(){
  const h=location.hash||'#/';
  let m;
  $('openCount').textContent=openDecisions().length||'';
  $('tabDecide').hidden=!openDecisions().length;
  $('tabDecide').setAttribute('aria-current',h.startsWith('#/decide')?'page':'false');
  $('tabRecords').setAttribute('aria-current',h.startsWith('#/records')?'page':'false');
  const pend=sessionPending();
  $('tabSession').hidden=!S.session&&LIVE;
  $('sessionCount').textContent=pend||'';
  $('tabSession').setAttribute('aria-current',h.startsWith('#/session')?'page':'false');
  if(h==='#/session')return renderSession();
  if(h==='#/'&&S.session&&(['planning','drafting'].includes(S.session.status)||pend)){location.replace('#/session');return;}
  if(h==='#/'&&!LIVE){location.replace('#/session');return;}
  if((m=h.match(/^#\/decide\/(\d{4})$/)))return renderDecide(m[1]);
  if(h==='#/decide'){const d=openDecisions()[0];if(d){location.replace('#/decide/'+d.id);return;}}
  if((m=h.match(/^#\/records\/(\d{4})$/)))return renderRecord(m[1]);
  if(h==='#/'&&openDecisions().length){location.replace('#/decide/'+openDecisions()[0].id);return;}
  renderList();
}

/* ---------- decide ---------- */
function renderDecide(id){
  const dec=S.decisions.find(d=>d.id===id);
  if(!dec){app.innerHTML=`<div class="step"><h1>No decision ${esc(id)}</h1><p class="lead"><a href="#/records">See all decisions</a></p></div>`;return;}
  if(!F||F.id!==id)F={id,A:{...(dec.answers||{})},qi:0,step:'ask',pick:null,done:dec.status!=='open'?{k:dec.choice,mode:dec.mode}:null};
  if(F.done)return renderDone(dec);
  F.step==='ask'?renderAsk(dec):renderRec(dec);
  scrollTo({top:0});
}
const toAsk=dec=>CAT[dec.kind].questions.filter(q=>!(q.fact&&dec.facts&&dec.facts[q.id]!=null));
function intro(dec){
  const K=CAT[dec.kind],pkg=dec.trigger&&dec.trigger.package;
  const known=CAT[dec.kind].questions.filter(q=>q.fact&&dec.facts&&dec.facts[q.id]!=null)
    .map(q=>`<span class="chip"><i></i>${esc(q.a[dec.facts[q.id]].l)} · from ${esc((dec.fact_sources||{})[q.id]||'your repo')}</span>`).join('');
  return `<span class="status"><span class="dot"></span>${esc(dec.agent||'Your agent')} is paused and waiting for you</span>
    <h1>${esc(K.title)}</h1>
    <p class="lead">${esc(dec.agent||'Your agent')} was about to add ${pkg?`<code>${esc(pkg)}</code>`:'a database'}${dec.task?` while working on <b>“${esc(dec.task)}”</b>`:''}. ${esc(K.undo)}</p>
    ${known?`<div class="known">Already known: ${known}</div>`:''}`;
}
function renderAsk(dec){
  const qs=toAsk(dec);
  if(!qs.length){F.step='rec';return renderRec(dec);}
  const q=qs[F.qi];
  app.innerHTML=`<div class="step">${intro(dec)}
    <div class="qhead"><span class="qnum">Question ${F.qi+1} of ${qs.length}</span><span class="pips">${qs.map((_,i)=>`<i class="${i<=F.qi?'on':''}"></i>`).join('')}</span></div>
    <p class="qtext">${esc(q.t)}</p><p class="qwhy">${esc(q.why)}</p>
    <div class="answers">${q.a.map((x,i)=>`<button class="ans ${F.A[q.id]===i?'sel':''}" data-a="${i}"><span class="key">${i+1}</span>${esc(x.l)}</button>`).join('')}</div>
    <div class="row">${F.qi>0?'<button class="link" data-go="back">Back</button>':''}<button class="link" data-go="later">Ask me later</button><button class="link" data-go="nopref">I don't mind, pick for me</button></div>
  </div>`;
}
function renderRec(dec){
  const K=CAT[dec.kind],a=ans(dec,F.A),m=model(K,a),best=m.r[0].k,chosen=F.pick||best,o=K.options[chosen],cf=confidence(dec,m),fl=flips(K,a,m);
  const why=chosen===best?`It fits because ${deciding(m).map(d=>K.reasons[d.f]).join(' and ')}. ${o.good[0][1]}`:`You picked this over ${K.options[best].n}, which fits your answers better.`;
  app.innerHTML=`<div class="step">
    <span class="status"><span class="dot"></span>${esc(dec.agent||'Your agent')} is paused and waiting for you</span>
    <div class="rec">
      <span class="small">${chosen===best?'Recommended for you':'Your choice'}</span>
      <h1>Use ${esc(o.tn)}</h1>
      <p class="why">${esc(why)}</p>
      <div class="accept"><b>You accept</b><span>${esc(o.bad[1][1])} ${esc(o.bad[0][1])}</span></div>
      <div class="row"><button class="btn primary" data-go="record">${CHECK}Use ${esc(o.tn)}</button><button class="link" data-why="${chosen}">Why?</button></div>
      <p class="small"><span class="lv ${cf.lv}">Confidence ${cf.lv}</span> &nbsp;${esc(cf.txt)}.${fl.length?` It would change if ${esc(fl[0].txt)}; then ${esc(K.options[fl[0].win].n)} fits better.`:''}</p>
      <p class="err" id="recErr" hidden></p>
    </div>
    <div class="others"><h2>Other options</h2>
      ${m.r.map(x=>x.k).filter(k=>k!==chosen).map(k=>`<div class="other"><span class="n">${esc(K.options[k].n)}${k===dec.agent_pick?'<span class="tag">Agent\'s pick</span>':''}${k===best?'<span class="tag">Best fit</span>':''}</span>
        <span class="d">${k===m.r[1].k&&m.close&&chosen===best?'Close second. ':''}${esc(K.options[k].bad[0][1])}</span>
        <span class="acts"><button class="link" data-why="${k}">Why?</button><button class="link" data-pick="${k}">Use this</button></span></div>`).join('')}
      ${m.out.map(k=>`<p class="ruled"><s>${esc(K.options[k].n)}</s> ruled out: ${esc(K.options[k].ko.why)}</p>`).join('')}
    </div>
    <div class="row">${toAsk(dec).length?'<button class="link" data-go="edit">Change my answers</button>':''}<button class="link" data-go="later">Ask me later</button></div>
  </div>`;
}
function renderDone(dec){
  const K=CAT[dec.kind],{k,mode}=F.done,parked=mode==='parked',o=K.options[k]||{};
  app.innerHTML=`<div class="step">
    <span class="status"><span class="dot ok"></span>${parked?`${esc(dec.agent||'Your agent')} continues without a database for now`:`${esc(dec.agent||'Your agent')} is continuing with your choice`}</span>
    <h1>${parked?'Parked for now':`Recorded: ${esc(o.n)}`}</h1>
    <p class="lead">${parked?'Hoist told the agent to keep data in memory until you decide, and saved this as a proposed decision.'
      :mode==='delegated'?'You didn\'t mind, so Hoist used the best fit and noted that it chose for you.':'Your reasons are saved with the decision, so anyone, or any agent, can see why later.'}
      ${LIVE?' You can go back to your terminal.':' In a real project, the agent now continues with this choice.'}</p>
    <div class="row"><a class="btn primary" href="#/records/${dec.id}">Read the record</a><a class="link" href="#/records">All decisions</a></div>
  </div>`;
}

/* ---------- MADR record ---------- */
function madr(dec,k,mode){
  const K=CAT[dec.kind],a=ans(dec,F.A),m=model(K,a),best=m.r[0].k,deleg=mode==='delegated',cf=confidence(dec,m,mode),fl=flips(K,a,m);
  const agent=dec.agent||'Your agent',task=dec.task?` (${dec.task})`:'';
  if(mode==='parked'){

/* ---------- reading records ---------- */
function parseMadr(md){
  const out={meta:{},title:'',short:{},sections:[]};let lines=md.replace(/\r/g,'').split('\n'),i=0;
  if(lines[0]==='---'){i=1;while(i<lines.length&&lines[i]!=='---'){const m=lines[i].match(/^([\w-]+):\s*(.*)$/);if(m)out.meta[m[1]]=m[2];i++;}i++;}
  let sec=null,sub=null;
  for(;i<lines.length;i++){
    const l=lines[i];
    if(/^# /.test(l)){out.title=l.slice(2).trim();continue;}
    if(/^> /.test(l)){const t=l.slice(2);const grab=(re)=>{const m=t.match(re);return m?m[1].trim().replace(/\.$/,''):''};
      out.short={decision:grab(/\*\*Decision:\*\*\s*(.*?)(?=\*\*|$)/),because:grab(/\*\*Because\*\*\s*(.*?)(?=\*\*|$)/),cost:grab(/\*\*Accepted cost:\*\*\s*(.*?)(?=\*\*|$)/),revisit:grab(/\*\*Revisit(?: if)?\*\*\s*(.*?)(?=\*\*|$)/)};continue;}
    if(/^## /.test(l)){sec={h:l.slice(3).trim(),lines:[],subs:[]};sub=null;out.sections.push(sec);continue;}
    if(/^### /.test(l)&&sec){sub={h:l.slice(4).trim(),lines:[]};sec.subs.push(sub);continue;}
    if(l.trim()&&sec)(sub||sec).lines.push(l);
  }
  return out;
}
const inline=t=>esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function listHtml(lines){
  const items=lines.map(l=>{
    let m;
    if((m=l.match(/^- \[ \] (.*)/)))return`<li class="todo">${inline(m[1])}</li>`;
    if((m=l.match(/^(?:- |\d+\. )(.*)/))){const t=m[1];return`<li class="${/^Good, because/.test(t)?'good':/^Bad, because/.test(t)?'bad':''}">${inline(t)}</li>`;}
    return`<p>${inline(l)}</p>`;
  });
  return items.some(x=>x.startsWith('<li'))?`<ul>${items.join('')}</ul>`:items.join('');
}

const pillStatus=s=>{const t=(s||'').split(' ')[0];return`<span class="pill ${t}">${esc(s||'')}</span>`;};

/* ranking from stated effects: each chosen answer favors (+1) or works against (-1) options, with a reason */
function rankDraft(dr,did,over){
  const ss=SS(),opts=dr.options.filter(o=>!o.ruled_out),sc={},why={};
  opts.forEach(o=>{sc[o.id]=0;why[o.id]=[];});
  const pa={...ss.profile_answers,...(over&&over.profile||{})},oa={...((ss.answers||{})[did]||{}),...(over&&over.own||{})};
  const apply=(a,qid,own)=>(a&&a.effects||[]).forEach(e=>{if(!(e.option in sc))return;sc[e.option]+=e.dir==='favors'?1:-1;if(e.dir==='favors')why[e.option].push({reason:e.reason,answer:a.label,qid,own});});
  (dr.profile_effects||[]).forEach(pe=>apply((pe.answers||[]).find(a=>a.label===pa[pe.profile_id]),pe.profile_id,false));
  (dr.questions||[]).forEach(q=>apply((q.answers||[]).find(a=>a.label===oa[q.id]),q.id,true));
  const rankOf=e=>e.own?0:({changed:0,confirmed:1})[((ss.confirmed||{})[e.qid])]??2;
  for(const k in why)why[k].sort((x,y)=>rankOf(x)-rankOf(y));
  const order=opts.map((o,i)=>({o,i})).sort((x,y)=>(sc[y.o.id]-sc[x.o.id])||((y.o.id===dr.default_option)-(x.o.id===dr.default_option))||(x.i-y.i)).map(x=>x.o);
  const close=order.length>1&&sc[order[0].id]-sc[order[1].id]<=1;
  return{order,sc,why,close};
}
/* "Because" ties each reason to the answer behind it: you said “X” (why that matters) */
const cleanReason=r=>lc(String(r||'').trim().replace(/^(also|and|so)\s+/i,'').replace(/[.;]+$/,''));
function becauseText(entries){
  const seen=new Set(),picked=[];
  for(const e of entries||[]){if(!e||!e.answer||seen.has(e.answer))continue;seen.add(e.answer);picked.push(`“${e.answer}” (${cleanReason(e.reason)})`);if(picked.length===2)break;}
  return picked.length?'you said '+picked.join(' and '):'';
}
const revisitText=f=>`your answer to “${f.q.replace(/\s+$/,'')}” becomes “${f.label}”`;
const taskLabel=()=>{const ss=SS(),t=String((ss.plan&&ss.plan.task_summary)||ss.task||'').trim().replace(/\.$/,'');return t.length>140?t.slice(0,139).replace(/\s+\S*$/,'')+'…':t;};
function flipsDraft(dr,did){
  const ss=SS(),win=rankDraft(dr,did).order[0].id,out=[];
  const prof=(SS().plan.profile||[]);
  (dr.profile_effects||[]).forEach(pe=>{const q=prof.find(x=>x.id===pe.profile_id);if(!q)return;
    q.answers.forEach(lbl=>{if(lbl===ss.profile_answers[q.id])return;const w=rankDraft(dr,did,{profile:{[q.id]:lbl}}).order[0];
      if(w.id!==win)out.push({q:q.text,label:lbl,txt:`you had answered “${lbl}” to “${q.text}”`,win:w});});});
  (dr.questions||[]).forEach(q=>q.answers.forEach(a=>{if(a.label===((ss.answers||{})[did]||{})[q.id])return;const w=rankDraft(dr,did,{own:{[q.id]:a.label}}).order[0];
    if(w.id!==win)out.push({q:q.text,label:a.label,txt:`you had answered “${a.label}” to “${q.text}”`,win:w});}));
  return out;
}
function confDraft(dr,rk,mode){
  if(mode==='delegated')return{lv:'low',txt:'you didn\'t mind, so Hoist used the default'};
  const inferred=(dr.evidence||[]).filter(e=>e.source==='inferred').length;
  if(rk.close)return{lv:'medium',txt:'the runner-up is close'+(inferred?`; ${inferred} fact${inferred>1?'s':''} inferred`:'')};
  if(inferred)return{lv:'medium',txt:`${inferred} fact${inferred>1?'s were':' was'} inferred by Muse Spark`};
  return{lv:'high',txt:'your answers point clearly one way'};
}

  const step=(f,ms)=>new Promise(r=>setTimeout(()=>{f();r();},ms));
  await step(()=>{G.sim={...G.sim,status:'drafting',plan:base.plan,total,current:base.plan.decisions.find(d=>d.mode==='ask').id};},2400);
  const ids=base.plan.decisions.filter(d=>d.mode==='ask').map(d=>d.id);
  for(let i=0;i<ids.length;i++)await step(()=>{G.sim={...G.sim,drafted:ids.slice(0,i+1),current:ids[i+1]||null};},1600);
  await step(()=>{S.session={...base,task:base.task,status:'ready',profile_answers:{},answers:{},outcomes:{}};G.sim=null;},400);
  if(location.hash==='#/session')renderSession();
}
app.addEventListener('click',async e=>{
  if(!/^#\/session/.test(location.hash))return;
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ex){$('taskIn').value=b.dataset.ex;return;}
  const s=b.dataset.s;
  if(s==='start')return startSession($('taskIn').value.trim());
  if(s==='retry')return startSession(SS().task,true);
  if(s==='begin'){G.view='tabs';return renderSession();}
  if(s==='pback'){G.pi--;return renderSession();}
  if(s==='reset'){S.session=null;G={view:null,pi:0,sim:null,etab:null,etier:{},epick:{}};return renderSession();}
  if(b.dataset.pa!=null){const q=SS().plan.profile[G.pi];await saveAnswers({profile_answers:{[q.id]:q.answers[+b.dataset.pa]}});G.pi++;return renderSession();}
  if(b.dataset.etab){G.etab=b.dataset.etab;return renderSession();}
  if(b.dataset.etier){G.etier[cur().id]=+b.dataset.etier;return renderSession();}
  if(b.dataset.epick){const dd=cur();G.epick=G.epick||{};G.epick[dd.id]=G.epick[dd.id]===b.dataset.epick?null:b.dataset.epick;return renderSession();}
  if(b.dataset.hyper){const dd=cur();return openHyper(dd.id,b.dataset.hyper);}
  if(s==='refine'){const id=cur().id;G.refineOpen=G.refineOpen||{};G.refineOpen[id]=!G.refineOpen[id];renderSession();const t=$('refineIn');if(t)t.focus();return;}
  if(s==='finish'){G.view='done';return renderSession();}
  if(s==='abandon')return abandonSession(cur());
  if(s==='choose')return chooseSession('chosen',b.dataset.o);
  if(s==='delegate')return chooseSession('delegated');
  if(s==='park')return chooseSession('parked');
  if(s==='skip'){const d=cur();return recordSession(d,{choice:d.default,mode:'default',slug:slugify(d.title+' default'),markdown:madrDefault(d)}).then(()=>{advanceTab();renderSession();});}
});
app.addEventListener('input',e=>{if(e.target.id==='refineIn'){G.notes=G.notes||{};G.notes[cur().id]=e.target.value;}});
app.addEventListener('change',e=>{if(e.target.id==='newbie'){NEWBIE=e.target.checked;try{localStorage.setItem(NEWBIE_KEY,NEWBIE?'1':'0');}catch(x){}if(/^#\/session/.test(location.hash))renderSession();}});
document.addEventListener('keydown',e=>{
  if(!/^#\/session/.test(location.hash)||$('whySheet').classList.contains('on')||!/^[1-9]$/.test(e.key)||e.target.tagName==='TEXTAREA')return;
  const btns=[...app.querySelectorAll('[data-pa]')];const b=btns[+e.key-1];if(b)b.click();
});

/* ---------- why sheet ---------- */
function openWhy(dec,k){
  const K=CAT[dec.kind],a=ans(dec,F.A),m=model(K,a),o=K.options[k],s=m.s[k],ko=!viable(K,k,a);
  $('whyTitle').textContent=o.n;$('whySub').textContent=ko?`Ruled out: ${o.ko.why}`:o.sub;
  const facts=[];
  K.questions.forEach(q=>{const known=q.fact&&dec.facts&&dec.facts[q.id]!=null;facts.push([q.a[a[q.id]].l,known?((dec.fact_sources||{})[q.id]||'your repo'):'your answer',q]);});
  if(dec.task)facts.push([`Task: “${dec.task}”`,`${dec.agent||'agent'}'s task`,null]);
  const rows=Object.keys(m.w).sort((x,y)=>m.w[y]-m.w[x]);
  $('whyBody').innerHTML=`
    <ul class="facts">${o.good.map(g=>`<li><span>${esc(g[1])}</span><span class="src" style="color:var(--accent)">good · ${g[0]}</span></li>`).join('')}${o.bad.map(b=>`<li><span>${esc(b[1])}</span><span class="src" style="color:var(--oneway)">bad · ${b[0]}</span></li>`).join('')}</ul>
    <p class="small"><b>What Hoist based this on</b></p>
    <ul class="facts">${facts.map(([t,src])=>`<li><span>${esc(t)}</span><span class="src">${esc(src)}</span></li>`).join('')}</ul>
    <details class="more"><summary>See how the facts connect</summary><div class="gwrap">${graph(K,dec,a,m,k)}</div></details>
    <details class="more"><summary>See the numbers behind the ranking</summary>
      <p class="small" style="margin-bottom:8px">Your answers set how much each factor matters; Hoist's catalog rates each option. The numbers only put options in order.</p>
      <table class="raw"><tr><th>Factor</th><th>Weight</th><th>Rating</th></tr>${rows.map(f=>`<tr><td>${esc(K.factors[f])}</td><td>${m.w[f]}</td><td>${ko&&f==='host'?'ruled out':s[f]+'/10'}</td></tr>`).join('')}</table></details>`;
  $('whySheet').classList.add('on');$('whySheet').setAttribute('aria-hidden','false');$('scrim').classList.add('on');setTimeout(()=>$('whyClose').focus(),60);
}
function graph(K,dec,a,m,k){
  const src=K.questions.map(q=>({t:q.a[a[q.id]].l,f:q.id==='host'?['host']:Object.keys((q.a.find(x=>x.w)||{}).w||{}),known:q.fact&&dec.facts&&dec.facts[q.id]!=null}));
  const fac=Object.keys(K.factors),s=m.s[k],ko=!viable(K,k,a);
  const X=[8,240,470],W=[210,200,150],NH=34,G=10,H=Math.max(src.length,fac.length)*(NH+G);
  const pos=(c,i,n)=>({x:X[c],y:(H-(n*(NH+G)-G))/2+i*(NH+G),w:W[c]});
  const P=(a,b,col,wd)=>{const x1=a.x+a.w,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2,dx=(x2-x1)/2;return`<path d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="${col}" stroke-width="${wd}"/>`;};
  let out='';const op=pos(2,0,1);
  src.forEach((n,i)=>n.f.forEach(f=>{const j=fac.indexOf(f);if(j>=0)out+=P(pos(0,i,src.length),pos(1,j,fac.length),'var(--faint)',1.2);}));
  fac.forEach((f,j)=>{const bad=(ko&&f==='host')||s[f]<=5,good=s[f]>=8&&!bad;out+=P(pos(1,j,fac.length),op,good?'var(--accent)':bad?'var(--oneway)':'var(--faint)',1+m.w[f]/2);});
  const box=(p,t,col,dash)=>`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${NH}" rx="8" stroke="${col}" ${dash?'stroke-dasharray="4 3"':''}/><text x="${p.x+10}" y="${p.y+21}" font-size="12">${esc(t.length>30?t.slice(0,29)+'…':t)}</text>`;
  src.forEach((n,i)=>out+=box(pos(0,i,src.length),n.t,n.known?'var(--accent)':'var(--ink)'));
  fac.forEach((f,j)=>out+=box(pos(1,j,fac.length),K.factors[f],'var(--line)'));
  out+=box(op,K.options[k].n,ko?'var(--oneway)':'var(--accent)');
  return`<svg class="g" viewBox="0 0 630 ${H}" role="img" aria-label="How your answers connect to this option">${out}</svg>`;
}
function closeWhy(){$('whySheet').classList.remove('on');$('whySheet').setAttribute('aria-hidden','true');$('scrim').classList.remove('on');}

/* ---------- events ---------- */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),3000);}
function answer(dec,i){const qs=toAsk(dec);F.A[qs[F.qi].id]=i;if(F.qi<qs.length-1)F.qi++;else F.step='rec';renderDecide(dec.id);}
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!F)return;
  const dec=S.decisions.find(d=>d.id===F.id);if(!dec)return;
  const K=CAT[dec.kind];
  if(b.dataset.a!=null)return answer(dec,+b.dataset.a);
  if(b.dataset.why)return openWhy(dec,b.dataset.why);
  if(b.dataset.pick){const best=model(K,ans(dec,F.A)).r[0].k;F.pick=b.dataset.pick===best?null:b.dataset.pick;return renderDecide(dec.id);}
  const go=b.dataset.go,best=()=>model(K,ans(dec,F.A)).r[0].k;
  if(go==='back'){F.qi--;renderDecide(dec.id);}
  if(go==='edit'){F.step='ask';F.qi=0;renderDecide(dec.id);}
  if(go==='later')finish(dec,best(),'parked');
  if(go==='nopref'){F.pick=null;finish(dec,best(),'delegated');}
  if(go==='record')finish(dec,F.pick||best(),F.pick?'chosen':'chosen');
});
$('whyClose').onclick=closeWhy;$('scrim').onclick=closeWhy;
document.addEventListener('click',e=>{
  const t=e.target;
  if(t&&t.classList&&t.classList.contains('m-veil'))return closeEmodal();
  const x=t&&t.closest?t.closest('[data-eveil]'):null;
  if(x)return closeEmodal();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeEmodal();return closeWhy();}
  if(!F||F.done||F.step!=='ask'||!/^#\/decide\//.test(location.hash)||$('whySheet').classList.contains('on'))return;
  const dec=S.decisions.find(d=>d.id===F.id);if(!dec)return;const q=toAsk(dec)[F.qi];
  if(q&&/^[1-9]$/.test(e.key)&&+e.key<=q.a.length)answer(dec,+e.key-1);
});
boot();
</script>
