<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hoist prototype: how a coding agent's lasting decisions are explained to you and recorded. Sample data; no API calls.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hoist Decision Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, one step at a time (ask → recommend → recorded). Details live in side sheets. */
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --ink:#16201C; --muted:#56635D; --faint:#86918C; --line:#DBE1DE; --soft:#ECF0EE;
  --accent:#0F7657; --accent-soft:#DFF0E8; --accent-ink:#FFFFFF;
  --oneway:#B0443D; --oneway-soft:#F6E3E1; --heavy:#94621A; --heavy-soft:#F5EAD7; --scrim:rgba(22,32,28,.28);
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1311; --surface:#151C19; --ink:#E2E9E5; --muted:#9BA8A2; --faint:#6C7973; --line:#26302C; --soft:#1B2420;
  --accent:#52C49B; --accent-soft:#15342A; --accent-ink:#04130D;
  --oneway:#E68B83; --oneway-soft:#3A1F1C; --heavy:#E2B062; --heavy-soft:#33280F; --scrim:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1311; --surface:#151C19; --ink:#E2E9E5; --muted:#9BA8A2; --faint:#6C7973; --line:#26302C; --soft:#1B2420;
  --accent:#52C49B; --accent-soft:#15342A; --accent-ink:#04130D;
  --oneway:#E68B83; --oneway-soft:#3A1F1C; --heavy:#E2B062; --heavy-soft:#33280F; --scrim:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mark{font-family:var(--mono);font-weight:500;font-size:15px}
.proj{color:var(--muted);font-size:13.5px}
.barbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.barbtn:hover{color:var(--ink)}
.badge{font-family:var(--mono);font-size:11px;color:var(--heavy);background:var(--heavy-soft);border-radius:999px;padding:0 7px}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:56px 72px}
@media (max-width:640px){.wrap{padding-block:28px 48px}}
.step{display:flex;flex-direction:column;gap:22px;animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.status{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--heavy);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--heavy);opacity:0;animation:breathe 2.4s var(--ease) infinite}
.dot.ok{background:var(--accent)} .dot.ok::after{border-color:var(--accent)}
@keyframes breathe{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.7);opacity:0}}
h1{font-size:clamp(28px,4.4vw,38px);line-height:1.1;letter-spacing:-.025em;font-weight:600;margin:0;text-wrap:balance}
.lead{font-size:17px;color:var(--muted);margin:0;max-width:56ch;text-wrap:pretty}
.lead b{color:var(--ink);font-weight:500}
code{font-family:var(--mono);font-size:.88em;background:var(--soft);padding:1px 6px;border-radius:5px;color:var(--ink)}

.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px}
.qnum{font-family:var(--mono);font-size:12px;color:var(--faint)}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:3px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--ink)}
.qtext{font-size:21px;font-weight:500;letter-spacing:-.01em;margin:0}
.qwhy{font-size:14px;color:var(--faint);margin:-12px 0 0}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:16px;transition:border-color .2s var(--ease),transform .15s var(--ease)}
.ans:hover{border-color:var(--faint)}
.ans:active{transform:scale(.99)}
.ans .key{font-family:var(--mono);font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:5px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.ans.sel{border-color:var(--ink)}
.ans .hint{margin-left:auto;font-size:12.5px;color:var(--faint)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.link:hover{color:var(--ink);text-decoration-color:var(--ink)}

.rec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.rec .why{font-size:16.5px;margin:0;max-width:56ch}
.accept{display:flex;gap:10px;font-size:15px;color:var(--muted);padding-top:14px;border-top:1px solid var(--line)}
.accept b{color:var(--ink);font-weight:500;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn svg{width:16px;height:16px}
.small{font-size:14px;color:var(--muted);margin:0}
.small b{color:var(--ink);font-weight:500}
.lv{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;background:var(--heavy-soft);color:var(--heavy)}
.lv.low{background:var(--oneway-soft);color:var(--oneway)}

.others h2{font-size:13px;font-weight:500;color:var(--faint);margin:0 0 8px}
.other{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.other:first-of-type{border-top:0}
.other .n{font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.other .d{font-size:14px;color:var(--muted);grid-column:1/2}
.other .acts{grid-row:1/3;grid-column:2;display:flex;gap:12px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--heavy-soft);color:var(--heavy)}
.ruled{font-size:13.5px;color:var(--faint);margin:6px 0 0}
.ruled s{text-decoration-color:var(--faint)}

.done{display:flex;flex-direction:column;gap:12px}
.file{font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
pre.adr{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;white-space:pre-wrap;word-break:break-word;max-height:460px;overflow:auto;margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);opacity:0;background:var(--ink);color:var(--surface);font-size:14px;padding:10px 16px;border-radius:10px;transition:transform .4s var(--ease),opacity .3s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);z-index:30}
.toast.on{transform:translate(-50%,0);opacity:1}

/* Side sheets: "Why?" (evidence) and "Project decisions" (map + agent log) */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:20;border:0}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(860px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:21;transform:translateX(104%);transition:transform .45s var(--ease);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.narrow{width:min(480px,100vw)}
.sheet.on{transform:none}
.sh{display:flex;align-items:flex-start;gap:14px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.015em}
.sh p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.sbody{overflow:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:18px;flex:1;min-height:0}
.sbody>*{flex:none}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.facts li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.facts li:first-child{border-top:0}
.facts .src{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;align-self:center}
.facts .src.inf{color:var(--heavy)}
.sec{font-size:13px;font-weight:500;color:var(--faint);margin:0}
details.more summary{cursor:pointer;font-size:14px;color:var(--muted)}
details.more[open] summary{margin-bottom:12px}
.gwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px}
svg.g{display:block;min-width:720px;width:100%;height:auto}
.gn rect{fill:var(--surface);stroke-width:1.4}
.gn text{fill:var(--ink);font-family:var(--sans)}
.gn .tg{fill:var(--faint);font-family:var(--mono);font-size:9.5px}
.ge{fill:none}
table.raw{border-collapse:collapse;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
table.raw td,table.raw th{padding:4px 10px;border-bottom:1px solid var(--line);text-align:right}
table.raw th{font-weight:400;color:var(--faint)}
table.raw td:first-child,table.raw th:first-child{text-align:left}
.map{list-style:none;margin:0;padding:0}
.map li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;padding:8px 0;font-size:14.5px}
.pin{width:11px;height:11px;border-radius:3px;margin-top:6px;border:1.5px solid var(--faint)}
.pin.d3{border-color:var(--oneway)} .pin.d2{border-color:var(--heavy)} .pin.now{background:var(--oneway);border-color:var(--oneway)} .pin.open{border-style:dashed}
.map .s{color:var(--muted);font-size:13px}
.y{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.y p{margin:0;color:var(--muted)} .y em{font-style:normal;color:var(--ink)}
.y .t{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.y .st{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--heavy)}
.y.ok .st{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header class="bar"><div class="in">
  <span class="mark">hoist</span>
  <span class="proj">fieldnotes · prototype with sample data</span>
  <button class="barbtn" id="openProject">Project decisions <span class="badge" id="logBadge"></span></button>
</div></header>

<main class="wrap" id="app"></main>

<button class="scrim" id="scrim" aria-label="Close" tabindex="-1"></button>
<aside class="sheet" id="whySheet" role="dialog" aria-modal="true" aria-labelledby="whyTitle" aria-hidden="true">
  <div class="sh"><div><h2 id="whyTitle"></h2><p id="whySub"></p></div><button class="x" data-close aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
  <div class="sbody" id="whyBody"></div>
</aside>
<aside class="sheet narrow" id="projSheet" role="dialog" aria-modal="true" aria-labelledby="projTitle" aria-hidden="true">
  <div class="sh"><div><h2 id="projTitle">Project decisions</h2><p>What's decided, what's open, and what your agent chose on its own.</p></div><button class="x" data-close aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l10 10M13 3L3 13"/></svg></button></div>
  <div class="sbody" id="projBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
const TODAY='2026-10-26';
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const FACTORS={rel:'Linked records for sharing',ops:'Nothing for you to run',host:'Works on your host',scale:'Room to grow',cost:'Low cost at your size'};
const REASON={rel:'your users share projects',ops:'nobody wants to run a database server',host:'it runs on Vercel as is',scale:'it leaves room to grow',cost:'it stays cheap at your size'};
const BASE={rel:1,ops:1,host:2,scale:1,cost:1};
const Q=[
  {id:'share',t:'Will people share projects with each other?',why:'Shared data needs records that point at each other.',alt:['projects were shared','projects weren\'t shared'],a:[{l:'Yes, teams share projects',w:{rel:4}},{l:'No, each person keeps their own'}]},
  {id:'ops',t:'Who will keep the database running?',why:'Someone has to patch it, back it up, and watch it.',alt:['nobody could run a server','someone could run a server'],a:[{l:'Nobody, ideally',w:{ops:3}},{l:'Someone on the team can'}]},
  {id:'scale',t:'How many users do you expect in the first year?',why:'Sets how much cost and room to grow matter.',alt:['you expected hundreds of users','you expected thousands of users','you expected millions of users'],a:[{l:'Hundreds',w:{cost:2}},{l:'Thousands',w:{scale:1}},{l:'Millions',w:{scale:4}}]}
];
const HOSTS=['Vercel','a server you run'];
const OPT={
  pg:{n:'Managed Postgres',sub:'Postgres on Neon, connected through Vercel',slug:'postgres',s:{rel:10,ops:8,host:9,scale:8,cost:6},server:{host:6},
    good:[['Now','Sharing is ordinary linked records with simple queries.'],['Later','The provider handles backups and patches.']],
    bad:[['Now','Adds a vendor account, and local development needs a connection string.'],['Later','A monthly bill once you pass the free tier.']]},
  turso:{n:'Hosted SQLite',sub:'SQLite on Turso, over the network',slug:'hosted-sqlite',s:{rel:8,ops:8,host:8,scale:6,cost:9},server:{host:7},
    good:[['Now','The same SQLite engine locally and in production.'],['Later','Low cost while you are small.']],
    bad:[['Now','Fewer hosting integrations and tools support it.'],['Later','A smaller ecosystem if you need extensions later.']]},
  mongo:{n:'Managed MongoDB',sub:'MongoDB on Atlas',slug:'mongodb',s:{rel:5,ops:8,host:8,scale:9,cost:5},server:{host:6},
    good:[['Now','Note shapes can change without migrations.'],['Later','Spreads across machines when collections get large.']],
    bad:[['Now','Sharing between users needs manual references and extra queries.'],['Later','Reports across users get harder to write.']]},
  sqlite:{n:'SQLite file',sub:'One database file next to the app',slug:'sqlite-file',s:{rel:8,ops:10,host:10,scale:3,cost:10},
    ko:{when:a=>a.host===0,why:'Vercel doesn\'t keep files between requests, so saved projects would vanish.'},
    good:[['Now','Free, one file, nothing to sign up for.'],['Later','Backups are a file copy.']],
    bad:[['Now','Only works where the disk is kept.'],['Later','One machine only; growing means a migration.']]}
};
const AGENT_PICK='mongo';
const MAP=[{t:'Language',s:'TypeScript · ADR-0001',c:'d3'},{t:'Hosting',s:'Vercel · ADR-0003',c:'d2'},{t:'Database',s:'Deciding now',c:'now'},{t:'Sign-in',s:'Waits on database',c:'open d2'},{t:'Backups',s:'Waits on database',c:'open d2'}];
const LOG=[
  {id:'zod',title:'Form validation: Zod',ctx:'the sign-up form',concern:'checking user input',chose:'Zod',over:'Yup',gain:'one schema for both types and checks',accept:'one more dependency'},
  {id:'rhf',title:'Form state: React Hook Form',ctx:'the sign-up and settings forms',concern:'tracking form state',chose:'React Hook Form',over:'Formik',gain:'fewer re-renders and a smaller bundle',accept:'a less familiar API for newcomers'},
  {id:'datefns',title:'Dates: date-fns',ctx:'showing when projects were edited',concern:'formatting dates',chose:'date-fns',over:'Day.js',gain:'importing only the functions in use',accept:'longer import lines'},
  {id:'argon',title:'Password hashing: argon2',ctx:'user accounts',concern:'storing passwords',chose:'argon2',over:'bcrypt',gain:'the current recommended algorithm',accept:'a native module to build on deploy'}
];

let A={share:null,ops:null,scale:null,host:0}, step='ask', qi=0, pick=null, done=null, reviewed={};
const ans=()=>({share:A.share??0,ops:A.ops??0,scale:A.scale??0,host:A.host});

function viable(k,a){const o=OPT[k];return !(o.ko&&o.ko.when(a));}
function model(a){
  const w={...BASE},s={};
  Q.forEach(q=>{const x=q.a[a[q.id]];if(x.w)for(const f in x.w)w[f]+=x.w[f];});
  for(const k in OPT){s[k]={...OPT[k].s};if(a.host===1&&OPT[k].server)Object.assign(s[k],OPT[k].server);}
  const max=Object.values(w).reduce((x,y)=>x+y,0)*10;
  const r=Object.keys(OPT).filter(k=>viable(k,a)).map(k=>({k,t:Object.keys(w).reduce((x,f)=>x+w[f]*s[k][f],0)})).sort((x,y)=>y.t-x.t);
  return{w,s,r,out:Object.keys(OPT).filter(k=>!viable(k,a)),close:r.length>1&&(r[0].t-r[1].t)/max<0.04};
}
function deciding(m){const[a,b]=m.r;return Object.keys(m.w).map(f=>({f,w:m.w[f],imp:m.w[f]*(m.s[a.k][f]-m.s[b.k][f])})).filter(x=>x.imp>0).sort((x,y)=>y.imp-x.imp).slice(0,2);}
function flips(m){
  const out=[],win=m.r[0].k,a=ans();
  Q.forEach(q=>q.a.forEach((x,i)=>{if(i===a[q.id])return;const m2=model({...a,[q.id]:i});if(m2.r[0].k!==win)out.push({txt:q.alt[i],win:m2.r[0].k});}));
  [0,1].forEach(i=>{if(i===a.host)return;const m2=model({...a,host:i});if(m2.r[0].k!==win)out.push({txt:`hosting moved to ${HOSTS[i]}`,win:m2.r[0].k});});
  return out;
}
function confidence(m,deleg){
  if(deleg)return{lv:'low',txt:'you had no preference, so Hoist chose'};
  return{lv:'medium',txt:m.close?'one fact is inferred, and the runner-up is close':'one fact is inferred from the agent\'s task'};
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
const $=id=>document.getElementById(id);
const app=$('app');

/* ---------- step 1: ask, one question at a time ---------- */
function renderAsk(){
  const q=Q[qi];
  app.innerHTML=`<div class="step">
    <span class="status"><span class="dot"></span>Muse Code is paused and waiting for you</span>
    <h1>Pick a database for saved projects</h1>
    <p class="lead">Muse Code was about to run <code>npm install mongodb</code>. Switching databases later means moving every saved project, so three quick questions first.</p>
    <div class="qhead"><span class="qnum">Question ${qi+1} of ${Q.length}</span><span class="pips">${Q.map((_,i)=>`<i class="${i<=qi?'on':''}"></i>`).join('')}</span></div>
    <p class="qtext">${q.t}</p>
    <p class="qwhy">${q.why}</p>
    <div class="answers">${q.a.map((x,i)=>`<button class="ans ${A[q.id]===i?'sel':''}" data-a="${i}"><span class="key">${i+1}</span>${x.l}</button>`).join('')}</div>
    <div class="row">${qi>0?'<button class="link" data-go="back">Back</button>':''}<button class="link" data-go="later">Ask me later</button><button class="link" data-go="nopref">I don't mind, pick for me</button></div>
  </div>`;
}

/* ---------- step 2: one recommendation ---------- */
function renderRec(){
  const a=ans(),m=model(a),best=m.r[0].k,chosen=pick||best,o=OPT[chosen],cf=confidence(m),fl=flips(m);
  const reasons=deciding(m).map(d=>REASON[d.f]);
  const why=chosen===best
    ? `It fits because ${reasons.join(' and ')}.`
    : `You picked this over ${OPT[best].n}, which fits your answers better.`;
  const others=m.r.map(x=>x.k).filter(k=>k!==chosen);
  app.innerHTML=`<div class="step">
    <span class="status"><span class="dot"></span>Muse Code is paused and waiting for you</span>
    <div class="rec">
      <span class="small">${chosen===best?'Recommended for you':'Your choice'}</span>
      <h1>Use ${o.n.charAt(0).toLowerCase()+o.n.slice(1)}</h1>
      <p class="why">${why} ${chosen===best?o.good[0][1]:''}</p>
      <div class="accept"><b>You accept</b><span>${lc(o.bad[1][1])} ${lc(o.bad[0][1])}</span></div>
      <div class="row"><button class="btn primary" data-go="record">${CHECK}Use ${o.n.charAt(0).toLowerCase()+o.n.slice(1)}</button><button class="link" data-why="${chosen}">Why?</button></div>
      <p class="small"><span class="lv">Confidence ${cf.lv}</span> &nbsp;${cf.txt}.${fl.length?` It would change if ${fl[0].txt}; then ${OPT[fl[0].win].n} fits better.`:''}</p>
    </div>
    <div class="others"><h2>Other options</h2>
      ${others.map(k=>`<div class="other"><span class="n">${OPT[k].n}${k===AGENT_PICK?'<span class="tag">Agent\'s pick</span>':''}${k===best?'<span class="tag">Best fit</span>':''}</span>
        <span class="d">${k===m.r[1].k&&m.close&&chosen===best?'Close second. ':''}${OPT[k].bad[0][1]}</span>
        <span class="acts"><button class="link" data-why="${k}">Why?</button><button class="link" data-pick="${k}">Use this</button></span></div>`).join('')}
      ${m.out.map(k=>`<p class="ruled"><s>${OPT[k].n}</s> ruled out: ${OPT[k].ko.why}</p>`).join('')}
    </div>
    <div class="row"><button class="link" data-go="edit">Change my answers</button><button class="link" data-go="later">Ask me later</button></div>
  </div>`;
}

/* ---------- step 3: recorded ---------- */
function renderDone(){
  const a=ans(),m=model(a),{k,mode}=done,parked=mode==='parked';
  const file=parked?'0004-keep-saved-projects-in-memory.md':`0004-store-saved-projects-in-${OPT[k].slug}.md`;
  app.innerHTML=`<div class="step">
    <span class="status"><span class="dot ok"></span>${parked?'Muse Code continues with a temporary store':'Muse Code is continuing with your choice'}</span>
    <h1>${parked?'Parked for now':`Recorded: ${OPT[k].n}`}</h1>
    <p class="lead">${parked?'Saved projects stay in memory until you decide. Hoist will ask again before the first real user signs up.'
      :mode==='delegated'?'You didn\'t mind, so Hoist used the best fit and noted that it chose for you. It will check back later.'
      :'Your reasons are saved with the decision, so anyone (or any agent) can see why later.'}</p>
    <div class="file"><span>docs/decisions/${file}</span><span>${parked?'proposed':'accepted'}</span></div>
    <details class="more"><summary>Show the record</summary><pre class="adr" id="adrText">${esc(adr(m,k,mode))}</pre></details>
    <div class="row"><button class="link" data-go="copy">Copy record</button><button class="link" data-go="undo">Undo</button></div>
  </div>`;
  $('logBadge').textContent=openCount()||'';
}

function render(){if(done)renderDone();else if(step==='ask')renderAsk();else renderRec();window.scrollTo({top:0});}

/* ---------- record (MADR) ---------- */
function adr(m,k,mode){
  const a=ans(),cf=confidence(m,mode==='delegated'),fl=flips(m),best=m.r[0].k;
  if(mode==='parked')return `---
status: proposed
date: ${TODAY}
door: one-way
proposed-by: Muse Code (adding user accounts with saved projects)
consulted: Muse Spark (repo analysis, questions)
deciders: project owner (asked to decide later)
confidence: low
---
# Keep saved projects in memory until the database is decided

## Context and Problem Statement
Where should user accounts and saved projects live? The owner chose to decide later.

## Decision Outcome
Short term: an in-memory store behind a small interface, so the real
database can be swapped in. Leading option when parked: ${OPT[best].n}.

### Consequences
- Good, because work continues without a lasting choice.
- Bad, because saved projects are lost on every deploy.

## More Information
- Revisit before the first real user signs up.`;
  const order=[k,...m.r.map(x=>x.k).filter(x=>x!==k)];
  return `---
status: accepted
date: ${TODAY}
door: one-way
proposed-by: Muse Code (adding user accounts with saved projects)
consulted: Muse Spark (repo analysis, questions)
deciders: ${mode==='delegated'?'Hoist, delegated by the project owner':'project owner'}
confidence: ${cf.lv}
depends-on: [0003-host-on-vercel]
---
# Store saved projects in ${lc(OPT[k].n)}

## Context and Problem Statement
Where should user accounts and saved projects live? Muse Code was about to
install MongoDB. The app has no database yet and runs on Vercel (ADR-0003).

## Decision Drivers
${Q.map(q=>`- ${q.t.replace(/\?$/,'')}: ${q.a[a[q.id]].l} (your answer)`).join('\n')}
- Vercel functions don't keep files between requests (Vercel docs)

## Considered Options
${order.map((x,i)=>`${i+1}. ${OPT[x].n}`).join('\n')}
${m.out.map(x=>`Ruled out: ${OPT[x].n}, because ${lc(OPT[x].ko.why)}`).join('\n')}

## Decision Outcome
Chosen: ${OPT[k].n}, because ${k===best?deciding(m).map(d=>REASON[d.f]).join(' and '):`the owner preferred it over ${OPT[best].n}`}.

### Consequences
${OPT[k].good.map(g=>`- Good, because ${lc(g[1])}`).join('\n')}
${OPT[k].bad.map(b=>`- Bad, because ${lc(b[1])}`).join('\n')}

### Confirmation
- Hoist blocks database drivers that conflict with this record.
- [ ] Restore one backup before launch.

## Pros and Cons of the Options
${order.slice(1).map(x=>`### ${OPT[x].n}${x===AGENT_PICK?' (the agent\'s original pick)':''}\n${OPT[x].good.map(g=>`- Good, because ${lc(g[1])}`).join('\n')}\n${OPT[x].bad.map(b=>`- Bad, because ${lc(b[1])}`).join('\n')}`).join('\n\n')}

## More Information
- Confidence: ${cf.lv}; ${cf.txt}.
${fl.map(f=>`- Revisit if ${f.txt}: ${OPT[f.win].n} would fit better.`).join('\n')||'- No single answer change would flip it.'}`;
}

/* ---------- "Why?" sheet: plain facts first, graph and numbers on request ---------- */
function openWhy(k){
  const a=ans(),m=model(a),o=OPT[k],ko=!viable(k,a),s=m.s[k];
  $('whyTitle').textContent=o.n;
  $('whySub').textContent=ko?`Ruled out: ${o.ko.why}`:o.sub;
  const facts=[
    ['Your app runs on Vercel','vercel.json'],['There is no database yet','package.json'],
    [`${a.share===0?'Users share projects':'Projects stay private'}`,'your answer'],
    [`${a.ops===0?'Nobody wants to run a server':'Someone can run a server'}`,'your answer'],
    [`${Q[2].a[a.scale].l} of users in year one`,'your answer'],
    ['Each user owns projects','inferred'],['Vercel doesn\'t keep files between requests','Vercel docs']];
  const rows=Object.keys(m.w).sort((x,y)=>m.w[y]-m.w[x]);
  $('whyBody').innerHTML=`
    <p class="sec">Good and bad</p>
    <ul class="facts">${o.good.map(g=>`<li><span>${g[1]}</span><span class="src" style="color:var(--accent)">good · ${g[0]}</span></li>`).join('')}${o.bad.map(b=>`<li><span>${b[1]}</span><span class="src" style="color:var(--oneway)">bad · ${b[0]}</span></li>`).join('')}</ul>
    <p class="sec">What Hoist based this on</p>
    <ul class="facts">${facts.map(([t,src])=>`<li><span>${t}</span><span class="src ${src==='inferred'?'inf':''}">${src==='inferred'?'inferred by Muse Spark':src}</span></li>`).join('')}</ul>
    <details class="more"><summary>See how the facts connect</summary><div class="gwrap">${graph(k,m)}</div></details>
    <details class="more"><summary>See the numbers behind the ranking</summary>
      <p class="small" style="margin-bottom:8px">Your answers set how much each factor matters; Hoist's catalog rates each option. The numbers only put options in order.</p>
      <table class="raw"><tr><th>Factor</th><th>Weight</th><th>Rating</th></tr>${rows.map(f=>`<tr><td>${FACTORS[f]}</td><td>${m.w[f]}</td><td>${ko&&f==='host'?'ruled out':s[f]+'/10'}</td></tr>`).join('')}</table></details>`;
  openSheet('whySheet');
}
function graph(k,m){
  const s=m.s[k],w=m.w,ko=!viable(k,ans());
  const cols=[['vercel.json','package.json','Your answers','Agent\'s task','Vercel docs'],['Runs on Vercel','No database yet','Sharing, upkeep, size','Users own projects','No lasting disk'],['Works on your host','Linked records','Nothing to run','Cost and growth'],[OPT[k].n]];
  const E=[[0,0,1,0],[0,1,3,0],[0,2,1,1],[0,2,1,2],[0,2,1,3],[0,3,1,3],[0,4,1,4],[1,0,2,0],[1,4,2,0],[1,2,2,1],[1,3,2,1],[1,2,2,2],[1,2,2,3]];
  const fx=['host','rel','ops','cost'];
  const X=[8,190,372,560],NW=[160,160,168,160],NH=36,G=12,H=5*(NH+G);
  const pos=(c,i)=>{const n=cols[c].length,tot=n*(NH+G)-G,y0=(H-tot)/2;return{x:X[c],y:y0+i*(NH+G),w:NW[c]};};
  let out='';
  const path=(a,b,col,wd)=>{const x1=a.x+a.w,y1=a.y+NH/2,x2=b.x,y2=b.y+NH/2,dx=(x2-x1)/2;return`<path class="ge" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}" stroke="${col}" stroke-width="${wd}"/>`;};
  E.forEach(([c1,i1,c2,i2])=>out+=path(pos(c1,i1),pos(c2,i2),'var(--faint)',1.2));
  fx.forEach((f,i)=>{const bad=(ko&&f==='host')||s[f]<=5,good=s[f]>=8&&!(ko&&f==='host');out+=path(pos(2,i),pos(3,0),good?'var(--accent)':bad?'var(--oneway)':'var(--faint)',1+w[f]/2);});
  cols.forEach((col,c)=>col.forEach((t,i)=>{const p=pos(c,i),inf=t==='Users own projects';
    out+=`<g class="gn"><rect x="${p.x}" y="${p.y}" width="${NW[c]}" height="${NH}" rx="8" stroke="${c===3?(ko?'var(--oneway)':'var(--accent)'):inf?'var(--heavy)':'var(--line)'}" ${inf?'stroke-dasharray="4 3"':''}/><text x="${p.x+10}" y="${p.y+22}" font-size="12">${esc(t)}</text></g>`;}));
  return `<svg class="g" viewBox="0 0 730 ${H}" role="img" aria-label="How the facts connect to this option">${out}</svg>`;
}

/* ---------- project decisions sheet ---------- */
const openCount=()=>LOG.filter(e=>!reviewed[e.id]).length;
function openProject(){
  $('projBody').innerHTML=`<p class="sec">Decisions</p>
    <ul class="map">${MAP.map(d=>`<li><span class="pin ${d.c}"></span><span>${d.t}<br><span class="s">${done&&d.c==='now'?(done.mode==='parked'?'Parked':OPT[done.k].n+' · ADR-0004'):d.s}</span></span></li>`).join('')}</ul>
    <p class="sec">Your agent decided on its own · ${openCount()} to review</p>
    <div>${LOG.map(e=>`<div class="y ${reviewed[e.id]?'ok':''}"><span class="t">${e.title}<span class="st">${reviewed[e.id]?'reviewed':'not reviewed'}</span></span>
      <p>In the context of <em>${e.ctx}</em>, facing <em>${e.concern}</em>, Muse Code chose <em>${e.chose}</em> over <em>${e.over}</em>, to achieve <em>${e.gain}</em>, accepting <em>${e.accept}</em>.</p>
      ${reviewed[e.id]?'':`<div class="row"><button class="link" data-rev="${e.id}">Looks right</button><button class="link" data-card="${e.id}">Ask me about this</button></div>`}</div>`).join('')}</div>`;
  openSheet('projSheet');
}

/* ---------- sheets, toast, events ---------- */
let openId=null,lastFocus=null;
function openSheet(id){openId=id;lastFocus=document.activeElement;$(id).classList.add('on');$(id).setAttribute('aria-hidden','false');$('scrim').classList.add('on');setTimeout(()=>$(id).querySelector('[data-close]').focus(),60);}
function closeSheet(){if(!openId)return;$(openId).classList.remove('on');$(openId).setAttribute('aria-hidden','true');$('scrim').classList.remove('on');openId=null;if(lastFocus)lastFocus.focus();}
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),3000);}

function answer(i){A[Q[qi].id]=i;if(qi<Q.length-1){qi++;render();}else{step='rec';render();}}
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a!=null)return answer(+b.dataset.a);
  if(b.dataset.why)return openWhy(b.dataset.why);
  if(b.dataset.pick){pick=b.dataset.pick===model(ans()).r[0].k?null:b.dataset.pick;return render();}
  const go=b.dataset.go,m=model(ans());
  if(go==='back'){qi--;render();}
  if(go==='edit'){step='ask';qi=0;render();}
  if(go==='later'){done={k:m.r[0].k,mode:'parked'};render();}
  if(go==='nopref'){Q.forEach(q=>{if(A[q.id]==null)A[q.id]=0;});pick=null;done={k:model(ans()).r[0].k,mode:'delegated'};render();}
  if(go==='record'){done={k:pick||m.r[0].k,mode:'chosen'};render();}
  if(go==='undo'){done=null;step='rec';render();}
  if(go==='copy'){const t=$('adrText').textContent;try{navigator.clipboard.writeText(t).then(()=>toast('Record copied'),()=>toast('Select the record text to copy it'));}catch(err){toast('Select the record text to copy it');}}
});
$('projBody').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.rev){reviewed[b.dataset.rev]=true;openProject();$('logBadge').textContent=openCount()||'';}
  if(b.dataset.card)toast('Hoist will ask you about this after the current decision.');});
$('openProject').onclick=openProject;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);$('scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')return closeSheet();
  if(!openId&&!done&&step==='ask'&&/^[1-3]$/.test(e.key)){const i=+e.key-1;if(i<Q[qi].a.length)answer(i);}
});
$('logBadge').textContent=openCount();
render();
</script>
