<!DOCTYPE html>
<!-- Design World hero: standalone, inline CSS + inline JS, no local assets, no build step.
     Open via any static server (module imports need http), e.g. python3 -m http.server -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design World — Explore New Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#000; --fg:#fff; --pad-x: clamp(20px, 6.95vw, 120px) }
html, body { height:100%; margin:0; background:#000; color:#fff; font-family:'Poppins',sans-serif; -webkit-font-smoothing:antialiased; overflow-x:clip }
.hero { position:relative; width:100%; height:100vh; height:100svh; min-height:520px; overflow:hidden; background:#000 }
#scene { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none }
#scene.dragging { cursor:grabbing }
.ui { position:absolute; inset:0; pointer-events:none; z-index:2 }
.ui a, .ui button { pointer-events:auto }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap }
.nav { position:absolute; top:clamp(24px,4.7vh,40px); left:var(--pad-x); right:var(--pad-x); display:flex; align-items:center; justify-content:space-between }
.logo { display:flex; align-items:center; gap:8px; color:#fff; text-decoration:none; font-size:15px; letter-spacing:-0.01em }
.logo-mark { width:20px; height:40px; background:#fff; border-radius:0 20px 20px 0 }
.logo b { font-weight:700 }
.logo span { font-weight:400 }
.nav-links { display:flex; gap:clamp(20px,4.1vw,60px); list-style:none; margin:0; padding:0 }
.nav-links a { color:#fff; text-decoration:none; font-size:15px; font-weight:500; position:relative }
.nav-links a::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; background:currentColor; transform:scaleX(0); transform-origin:right; transition:transform .35s ease }
.nav-links a:hover::after { transform:scaleX(1); transform-origin:left }
.arrows { position:absolute; top:18.9%; left:76.7%; display:flex; gap:32px; transform:translate(-19px,-50%) }
.arrow { width:38px; height:38px; border-radius:50%; border:2.5px solid #fff; background:transparent; color:#fff; display:grid; place-items:center; cursor:pointer; padding:0; transition:background .25s, color .25s }
.arrow svg { width:18px; height:18px }
.arrow:hover { background:#fff; color:#000 }
.dots { position:absolute; right:calc(var(--pad-x) - 7px); top:49.4%; transform:translateY(-50%); display:flex; flex-direction:column; gap:33px }
.dot { width:14px; height:14px; border-radius:50%; border:2px solid #fff; background:#fff; cursor:pointer; padding:0; transition:background .25s }
.dot.active { background:transparent }
.tagline { position:absolute; left:var(--pad-x); bottom:clamp(40px,7.5vh,70px); margin:0; font-size:clamp(24px,2.65vw,44px); line-height:1.2; font-weight:300; letter-spacing:-0.01em }
.tagline strong { font-weight:700; display:block }
.cta-row { position:absolute; left:45.6%; right:-1vw; top:88.7%; transform:translateY(-50%); display:flex; align-items:center }
.cta { flex:none; padding:0 15px; height:48px; display:inline-flex; align-items:center; border:1.5px solid rgba(255,255,255,.85); border-radius:6px; background:rgba(0,0,0,.15); color:#fff; font-size:14px; font-weight:400; text-decoration:none; cursor:pointer; transition:background .25s, color .25s }
.cta:hover { background:#fff; color:#000 }
.cta-line { flex:1; height:1.5px; background:rgba(255,255,255,.8); min-width:40px }
.count { flex:none; font-size:clamp(140px,19.8vw,360px); font-weight:400; line-height:1; letter-spacing:-0.02em; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.9); transform:translateY(6%); user-select:none }
.loader { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; transition:opacity .6s }
.loader.done { opacity:0 }
@media (max-width:900px), (max-aspect-ratio:1/1) {
  .arrows { left:auto; right:var(--pad-x); top:15%; transform:translateY(-50%); gap:14px }
  .tagline { bottom:clamp(150px,20vh,220px) }
  .cta-row { left:var(--pad-x); right:-3vw; top:auto; bottom:24px; transform:none }
  .count { font-size:clamp(120px,22vw,200px) }
}
@media (max-width:640px) {
  .nav-links { gap:16px }
  .nav-links a, .logo { font-size:13px }
  .dots { gap:20px; right:16px }
  .dot { width:10px; height:10px }
  .cta-row { right:-8vw }
  .count { font-size:120px }
}
@media (max-width:420px) { .nav-links li:nth-child(2) { display:none } }
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
  <div class="ui">
    <h1 class="sr-only">Explore New Ideas</h1>
    <header class="nav">
      <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
      <ul class="nav-links"><li><a>Home</a></li><li><a>Portfolio</a></li><li><a>Contact Us</a></li></ul>
    </header>
    <div class="arrows">
      <button class="arrow" id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="arrow" id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <nav class="dots"><button class="dot"></button><button class="dot active"></button><button class="dot"></button></nav>
    <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
    <div class="cta-row">
      <a href="#" class="cta">Explore Now</a>
      <span class="cta-line"></span>
      <span class="count" aria-hidden="true">07</span>
    </div>
    <div class="loader" id="loader">Loading model</div>
  </div>
</section>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';
const LINES = ['Explore', 'New', 'Ideas'];

const canvas = document.getElementById('scene');
const loaderEl = document.getElementById('loader');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);
const bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

let view = { W: 1, H: 1, dpr: 1, mobile: false };

// ---------- background headline (2D canvas -> texture) ----------
const headCanvas = document.createElement('canvas');
const hctx = headCanvas.getContext('2d');
const headTex = new THREE.CanvasTexture(headCanvas);
headTex.colorSpace = THREE.SRGBColorSpace;
headTex.minFilter = THREE.LinearFilter;
headTex.magFilter = THREE.LinearFilter;
headTex.generateMipmaps = false;

function drawHeadline() {
  const { W, H, dpr, mobile } = view;
  headCanvas.width = Math.max(1, Math.round(W * dpr));
  headCanvas.height = Math.max(1, Math.round(H * dpr));
  hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  hctx.fillStyle = '#000';
  hctx.fillRect(0, 0, W, H);
  let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
  const setFont = () => { hctx.font = `800 ${fs}px Poppins`; };
  setFont();
  hctx.fillStyle = '#e9e9e9';
  hctx.textAlign = 'center';
  hctx.textBaseline = 'alphabetic';
  const limit = W * (mobile ? 0.9 : 0.5);
  let widest = 0;
  for (const ln of LINES) widest = Math.max(widest, hctx.measureText(ln).width);
  if (widest > limit) { fs *= limit / widest; setFont(); }
  const cx = W * (mobile ? 0.5 : 0.505);
  const cy = H * (mobile ? 0.45 : 0.468);
  const gap = fs * 1.07, cap = fs * 0.7;
  for (let i = 0; i < 3; i++) hctx.fillText(LINES[i], cx, cy + cap / 2 + (i - 1) * gap);
  headTex.needsUpdate = true;
}

const bgScene = new THREE.Scene();
const bgQuad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({
    uniforms: { uTex: { value: headTex } },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      varying vec2 vUv;
      void main() {
        gl_FragColor = texture2D(uTex, vUv);
#include <colorspace_fragment>
      }
    `,
    depthTest: false, depthWrite: false
  })
);
bgQuad.frustumCulled = false;
bgScene.add(bgQuad);
// ---------- glass (screen-space refraction, 6-band dispersion) ----------
const GLASS_VERT = `
  varying vec3 vNormal;
  varying vec3 vEye;
  void main() {
    vec4 worldPos = modelMatrix * vec4(position, 1.0);
    vec4 mvPos = viewMatrix * worldPos;
    gl_Position = projectionMatrix * mvPos;
    vNormal = normalize(normalMatrix * normal);
    vEye = normalize(mvPos.xyz);
  }
`;
const GLASS_FRAG = `
  uniform sampler2D uTexture;
  uniform vec2 uResolution;
  uniform float uIorR;
  uniform float uIorY;
  uniform float uIorG;
  uniform float uIorC;
  uniform float uIorB;
  uniform float uIorP;
  uniform float uRefractPower;
  uniform float uChromatic;
  uniform float uSaturation;
  uniform float uShininess;
  uniform float uDiffuseness;
  uniform float uFresnelPower;
  uniform vec3 uLight;
  uniform float uBackside;
  varying vec3 vNormal;
  varying vec3 vEye;
  float specular(vec3 L, float shininess, float diffuseness, vec3 nrm, vec3 viewDir) {
    vec3 lv = normalize(L);
    vec3 hv = normalize(lv + viewDir);
    return pow(max(dot(nrm, hv), 0.0), shininess) + max(0.0, dot(nrm, lv)) * diffuseness;
  }
  void main() {
    vec2 uv = gl_FragCoord.xy / uResolution;
    vec3 n = normalize(vNormal);
    if (uBackside > 0.5) n = -n;
    vec3 eye = normalize(vEye);
    vec3 color = vec3(0.0);
    for (int i = 0; i < 16; i++) {
      float slide = float(i) / 16.0 * 0.045;
      vec4 tR = texture2D(uTexture, uv + refract(eye, n, 1.0 / uIorR).xy * (uRefractPower + slide * 1.0) * uChromatic);
      vec4 tY = texture2D(uTexture, uv + refract(eye, n, 1.0 / uIorY).xy * (uRefractPower + slide * 1.0) * uChromatic);
      vec4 tG = texture2D(uTexture, uv + refract(eye, n, 1.0 / uIorG).xy * (uRefractPower + slide * 2.0) * uChromatic);
      vec4 tC = texture2D(uTexture, uv + refract(eye, n, 1.0 / uIorC).xy * (uRefractPower + slide * 2.5) * uChromatic);
      vec4 tB = texture2D(uTexture, uv + refract(eye, n, 1.0 / uIorB).xy * (uRefractPower + slide * 3.0) * uChromatic);
      vec4 tP = texture2D(uTexture, uv + refract(eye, n, 1.0 / uIorP).xy * (uRefractPower + slide * 1.0) * uChromatic);
      float r = tR.x * 0.5;
      float y = (tY.x * 2.0 + tY.y * 2.0 - tY.z) / 6.0;
      float g = tG.y * 0.5;
      float c = (tC.y * 2.0 + tC.z * 2.0 - tC.x) / 6.0;
      float b = tB.z * 0.5;
      float p = (tP.z * 2.0 + tP.x * 2.0 - tP.y) / 6.0;
      float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
      float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
      float B = b + (2.0 * c + 2.0 * p - y) / 3.0;
      color += vec3(R, G, B);
    }
    color /= 16.0;
    float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
    color = mix(vec3(luma), color, uSaturation);
    vec3 viewDir = -eye;
    float spec = specular(-uLight, uShininess, uDiffuseness, n, viewDir)
      + 0.6 * specular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, viewDir);
    color += spec * (uBackside > 0.5 ? 0.35 : 1.0);
    float f = pow(1.0 + dot(eye, n), uFresnelPower);
    color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));
    color += vec3(0.004, 0.005, 0.007);
    gl_FragColor = vec4(color, 1.0);
#include <colorspace_fragment>
  }
`;

const rtBack = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });
const rtFront = new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType });

function glassMaterial({ refractPower, backside, side, texture }) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTexture: { value: texture },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uIorR: { value: 1.15 }, uIorY: { value: 1.16 }, uIorG: { value: 1.18 },
      uIorC: { value: 1.22 }, uIorB: { value: 1.22 }, uIorP: { value: 1.22 },
      uRefractPower: { value: refractPower },
      uChromatic: { value: 0.5 },
      uSaturation: { value: 1.08 },
      uShininess: { value: 90 },
      uDiffuseness: { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight: { value: new THREE.Vector3(-1, 1, 1) },
      uBackside: { value: backside }
    },
    vertexShader: GLASS_VERT,
    fragmentShader: GLASS_FRAG,
    side
  });
}
const frontMat = glassMaterial({ refractPower: 0.30, backside: 0, side: THREE.FrontSide, texture: rtFront.texture });
const backMat = glassMaterial({ refractPower: 0.22, backside: 1, side: THREE.BackSide, texture: rtBack.texture });

const scene = new THREE.Scene();
const pivot = new THREE.Group();
const spinner = new THREE.Group();
spinner.rotation.set(-0.42, 0.62, 0.18);
pivot.add(spinner);
scene.add(pivot);
let meshFront = null, meshBack = null;
function attachCube(geometry) {
  meshBack = new THREE.Mesh(geometry, backMat);
  meshFront = new THREE.Mesh(geometry, frontMat);
  spinner.add(meshBack, meshFront);
}

function normalizeUnit(geometry) {
  geometry.computeBoundingBox();
  const bb = geometry.boundingBox;
  const c = new THREE.Vector3();
  bb.getCenter(c);
  geometry.translate(-c.x, -c.y, -c.z);
  const size = new THREE.Vector3();
  bb.getSize(size);
  const m = Math.max(size.x, size.y, size.z) || 1;
  geometry.scale(1 / m, 1 / m, 1 / m);
  return geometry;
}
function useFallback() {
  attachCube(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
  loaderEl.classList.add('done');
}
new GLTFLoader().load(MODEL_URL, (gltf) => {
  try {
    gltf.scene.updateMatrixWorld(true);
    const parts = [];
    gltf.scene.traverse((obj) => {
      if (!obj.isMesh) return;
      let g = obj.geometry.clone();
      g.deleteAttribute('uv');
      g.deleteAttribute('color');
      g.deleteAttribute('tangent');
      g = mergeVertices(g, 1e-4);
      g.computeVertexNormals();
      g.applyMatrix4(obj.matrixWorld);
      parts.push(g);
    });
    const merged = parts.length ? mergeGeometries(parts, false) : null;
    if (!merged) throw new Error('merge failed');
    attachCube(normalizeUnit(merged));
    loaderEl.classList.add('done');
  } catch (e) {
    useFallback();
  }
}, undefined, useFallback);

function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const mobile = W < 768 || W / H < 1;
  view = { W, H, dpr, mobile };
  renderer.setPixelRatio(dpr);
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  rtBack.setSize(Math.round(W * dpr), Math.round(H * dpr));
  rtFront.setSize(Math.round(W * dpr), Math.round(H * dpr));
  frontMat.uniforms.uResolution.value.set(W * dpr, H * dpr);
  backMat.uniforms.uResolution.value.set(W * dpr, H * dpr);
  drawHeadline();
  const visH = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 10;
  const visW = visH * camera.aspect;
  const sx = mobile ? 0.5 : 0.517, sy = mobile ? 0.45 : 0.488;
  pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);
  const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
  pivot.scale.setScalar((px / H) * visH);
}
window.addEventListener('resize', layout);
// ---------- interaction ----------
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const X_AXIS = new THREE.Vector3(1, 0, 0);
const tmpQ = new THREE.Quaternion();
function orbit(dx, dy) {
  tmpQ.setFromAxisAngle(Y_AXIS, dx);
  spinner.quaternion.premultiply(tmpQ);
  tmpQ.setFromAxisAngle(X_AXIS, dy);
  spinner.quaternion.premultiply(tmpQ);
}

let dragging = false, lastX = 0, lastY = 0, lastMoveT = 0;
let velX = 0, velY = 0;
let lastRelease = -1e9;
let idleBlend = 0;
let spinRemaining = 0;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
  lastX = e.clientX; lastY = e.clientY;
  lastMoveT = performance.now();
  velX = 0; velY = 0;
  spinRemaining = 0;
  idleBlend = 0;
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const now = performance.now();
  const dx = (e.clientX - lastX) * 0.008;
  const dy = (e.clientY - lastY) * 0.008;
  lastX = e.clientX; lastY = e.clientY;
  orbit(dx, dy);
  const s = 16.667 / Math.max(now - lastMoveT, 1);
  lastMoveT = now;
  velX = dx * s; velY = dy * s;
});
function endDrag() {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  lastRelease = performance.now();
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

document.getElementById('prev').addEventListener('click', () => {
  velX = 0; velY = 0;
  spinRemaining = -Math.PI / 2;
});
document.getElementById('next').addEventListener('click', () => {
  velX = 0; velY = 0;
  spinRemaining = Math.PI / 2;
});
document.querySelectorAll('.dot').forEach((d) => {
  d.addEventListener('click', () => {
    document.querySelectorAll('.dot').forEach((o) => o.classList.remove('active'));
    d.classList.add('active');
  });
});

// ---------- frame loop: bg -> back glass -> front glass ----------
let prevT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - prevT) / 1000, 0.05);
  prevT = now;
  const f60 = dt * 60;
  if (!dragging && spinRemaining !== 0) {
    const step = spinRemaining * Math.min(1, 0.09 * f60);
    orbit(step, 0);
    spinRemaining -= step;
    if (Math.abs(spinRemaining) < 0.0005) spinRemaining = 0;
  }
  if (!dragging && spinRemaining === 0 && (velX !== 0 || velY !== 0)) {
    orbit(velX * f60, velY * f60);
    const k = Math.pow(0.94, f60);
    velX *= k; velY *= k;
    if (Math.abs(velX) < 1e-5 && Math.abs(velY) < 1e-5) { velX = 0; velY = 0; }
  }
  const idleTarget = (!dragging && now - lastRelease > 600) ? 1 : 0;
  if (idleBlend < idleTarget) idleBlend = Math.min(1, idleBlend + dt / 1.0);
  else idleBlend = idleTarget;
  if (idleBlend > 0) orbit(0.0035 * idleBlend * f60, 0.0012 * idleBlend * f60);

  const hasCube = meshFront && meshBack;
  renderer.setRenderTarget(rtBack);
  renderer.render(bgScene, bgCam);
  renderer.setRenderTarget(rtFront);
  renderer.render(bgScene, bgCam);
  renderer.autoClear = false;
  if (hasCube) {
    meshFront.visible = false;
    meshBack.visible = true;
    renderer.render(scene, camera);
  }
  renderer.setRenderTarget(null);
  renderer.autoClear = true;
  renderer.render(bgScene, bgCam);
  renderer.autoClear = false;
  renderer.clearDepth();
  if (hasCube) {
    meshBack.visible = false;
    meshFront.visible = true;
    renderer.render(scene, camera);
  }
  renderer.autoClear = true;
}

// ---------- boot: wait for fonts, then layout + loop ----------
if (document.fonts && document.fonts.addEventListener) {
  document.fonts.addEventListener('loadingdone', drawHeadline);
}
const fontsReady = (document.fonts && document.fonts.load)
  ? Promise.all([document.fonts.load('800 100px Poppins'), document.fonts.ready])
  : Promise.resolve();
Promise.race([fontsReady, new Promise((res) => setTimeout(res, 2500))]).then(() => {
  layout();
  prevT = performance.now();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
